r of religion. It is the ascension of the believer. Prayer is the key to all goodness and the key to the Lord's treasury.»",source:"Risale-i Nur",volume:"The Words",bookId:1,page:"4th Word",topic:"newej",arabic:"إِنَّ الصَّلَاةَ تَنْهَىٰ عَنِ الْفَحْشَاءِ"},{id:4,text:"«Patience is the key to success. For the one who has patience, even the greatest matters become easy. Allah is with the patient; so be patient, and you will be victorious.»",source:"Risale-i Nur",volume:"The Words",bookId:1,page:"21st Word",topic:"sebr",arabic:"إِنَّ اللَّهَ مَعَ الصَّابِرِينَ"},{id:5,text:"«The Holy Quran is the eternal translator of this great book of the universe; it is the spiritual author that reveals the different secrets of the creational verses.»",source:"Risale-i Nur",volume:"The Words",bookId:1,page:"25th Word",topic:"quran",arabic:"ذَٰلِكَ الْكِتَابُ لَا رَيْبَ فِيهِ"},{id:6,text:"«Death is not non-existence, nor is it destruction; death is the end of a duty and a transition to a world of light. Through death, a believing person is freed from the prison of the body.»",source:"Risale-i Nur",volume:"The Words",bookId:1,page:"28th Word",topic:"merg",arabic:"كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ"},{id:7,text:"«O youth! The period of youth is expansive; because it passes, its pleasures are lost very quickly, leaving behind severe sins and eternal pain.»",source:"Risale-i Nur",volume:"The Flashes",bookId:3,page:"26th Flash, 8th Hope",topic:"lawan",arabic:"وَبَشِّرِ الَّذِينَ آمَنُوا"},{id:8,text:"«Good character is the result of faith; faith is like a tree whose fruit is beautiful behavior. The deeper a person's faith, the more graceful their behavior.»",source:"Risale-i Nur",volume:"Mathnawi al-Nuriye",bookId:8,page:"Morality Section",topic:"exlaq",arabic:"إِنَّمَا بُعِثْتُ لِأُتَمِّمَ مَكَارِمَ الْأَخْلَاقِ"},{id:9,text:"«Bismillah is the start of all things; Bismillah is a sign of light on everything. That blessed word, which holds great distinction, is a sign of elevation and greatness for any duty that begins with it.»",source:"Risale-i Nur",volume:"The Words",bookId:1,page:"1st Word",topic:"iman",arabic:"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ"},{id:10,text:"«This universe is a great book of the Lord; every creature is a word and every atom is a letter that shows the beautiful names of Almighty Allah.»",source:"Risale-i Nur",volume:"The Words",bookId:1,page:"30th Word",topic:"jiyan",arabic:"سَنُرِيهِمْ آيَاتِنَا فِي الْآفَاقِ"},{id:11,text:"«Tawakkul means trusting in Allah after one has done their best with apparent means; so tawakkul is not rejecting action and causes, but entrusting the outcome to the power of Allah.»",source:"Risale-i Nur",volume:"The Words",bookId:1,page:"23rd Word",topic:"dlniyayi",arabic:"وَعَلَى اللَّهِ فَتَوَكَّلُوا"},{id:12,text:"«Repentance is an always-open door; no matter how great the sin, Allah's mercy is greater. It is never too late to return to Allah.»",source:"Risale-i Nur",volume:"The Flashes",bookId:3,page:"21st Flash",topic:"tobe",arabic:"إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ"},{id:13,text:"«Knowledge is a means of discovering meaning, not just gathering information; any knowledge that does not bring a person closer to Allah is a burden on the heart, not a light.»",source:"Risale-i Nur",volume:"The Rays",bookId:4,page:"15th Ray",topic:"zanyari",arabic:"وَقُل رَّبِّ زِدْنِي عِلْمًا"},{id:14,text:"«Sincerity is the soul of all good deeds; without sincerity, the greatest deeds appear as dregs, and with sincerity, the smallest deed becomes a treasure for the hereafter.»",source:"Risale-i Nur",volume:"The Flashes",bookId:3,page:"20th Flash (Sincerity)",topic:"ixlas",arabic:"وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ"},{id:15,text:"«This world is a great mosque of Almighty Allah and the surface of the earth is a table of His blessings; so a believer looks at it with an eye of gratitude, not pride.»",source:"Risale-i Nur",volume:"The Letters",bookId:2,page:"28th Letter",topic:"iman",arabic:"لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ"},{id:16,text:"«Brotherhood for the sake of the hereafter is sacred; that connection makes hearts one and deepens spirituality. Hatred and enmity for worldly interests are unworthy of the believer's soul.»",source:"Risale-i Nur",volume:"The Letters",bookId:2,page:"22nd Letter",topic:"exlaq",arabic:"إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ"}],cx=[{id:1,topic:"iman",readTime:7,source:"Biography — 777",title:"The World in a Suffocating Crisis",excerpt:"The disease that has spread in the body of Western society and shaken its spiritual pillars is like a terrible plague.",body:["The world is going through a suffocating crisis and immense spiritual anxiety.","The disease that has spread in the body of Western society and shaken its spiritual pillars is like a terrible plague.","What are the remedies for the Islamic society to confront this terrifyingly spreading disease? Is it with the rotten and unjust recipes of the 'West', or with the living foundations of 'Faith' which belong to the fortress-like society of Islam?","I see the leaders drowning in heedlessness; the 'fortresses of faith' can never be supported by the decayed pillars of disbelief. That is why all my efforts and struggles are solely through faith, and I have dedicated all my suffering and hard work entirely to the cause of faith.","They do not understand the 'Risale-i Nur' messages, or they do not want to understand. They think I am a religious school teacher and that I am dry and unaware of the material affairs of the world!","In reality, I have worked with pure sciences and all modern philosophies, analyzing their most complex issues, even authoring books on them.","But I do not acknowledge the tricks of logic, nor do I listen to the deceit of philosophy. Rather, the anthem of the essence of society's life, spiritual existence, conscience, and faith is on my lips. I have focused all my preoccupations on the foundation of Tawhid (monotheism) and faith established by the Quran. Be assured that the main pillar of the Islamic society is only this; if it shakes, the society perishes."]},{id:2,topic:"iman",readTime:4,source:"The Flashes — 311",title:"O People of Truth!",excerpt:"Try to eradicate this terrifying disease (the disease of discord) by acting upon this high and great Quranic principle.",body:["O People of Truth!","O people of Reality, Sharia, and Tariqa!","O those who seek truth only for the sake of truth!","Try to eradicate this terrifying disease (the disease of discord) by acting upon this high and great Quranic principle which states: (And when they pass by vain talk, they pass by with dignity)...","Overlook the mistakes of your brothers, forgive their shortcomings, close your eyes to each other's faults, and put aside your internal disputes for now. Because external enemies are attacking you from all sides...","Also, consider saving the people of truth from defeat and humiliation as your most important duty and your responsibility for the hereafter...","Implement within yourselves those hundreds of verses and hadiths that call for brotherhood, love, and mutual assistance."]},{id:3,topic:"jiyan",readTime:5,source:"The Letters",title:"O Heedless One!",excerpt:"Do you doubt that you are protected from the interference of the One who handed you a pomegranate on a branch?",body:["O Heedless One!","Do you doubt that you are protected from the interference of the One who handed you a pomegranate on a branch created for you, and gives you a melon on a vine ripened for you?","It is out of your heedlessness that you think the Creator of the melon is unaware of its eater... and it is your blindness that makes you assume the Maker of the pomegranate is a blind force, unaware of His work, which He accomplishes with that pomegranate and its juiciness for the fruit eaters and for those amazed by this craft, who say: 'Glory be to Allah, who created me in this beautiful form and pattern!'","Also for those who reflect on the softness and delicacy of the pomegranate and say: ﴿So blessed is Allah, the best of creators﴾ (Al-Mu'minun: 14). And for those who ponder the arranged order that proclaims with all its might: ﴿Does He who created not know, while He is the Subtle, the Acquainted?﴾ (Al-Mulk: 14)?","Or do you think—O ignorant one!—that the One who sends all these fruits to eliminate our needs does not see or know us?","Or that the One who subjugates domesticated mammals and other animals for our benefit, placing them in our homes and shelters, does not see us?"]},{id:4,topic:"iman",readTime:6,source:"The Words",title:"Know this! You are doing something very wrong",excerpt:"Know this! You are doing something very wrong if you attach your heart to something that will not stay with you after the destruction of this world.",body:["Know this! You are doing something very wrong if you attach your heart to something that will not stay with you after the destruction of this world, even separating from you when the world falls apart. Because a person does not act wisely if they attach their heart to something perishable!","Let alone that thing which, at the end of the era you live in, will abandon you and turn its back on you! Let alone that thing which will not accompany you on the journey of the intermediate realm (Barzakh)! Let alone that thing which will only come with you to the door of your grave! Let alone a thing that, after a year or two, will leave you completely and forever, leaving its sin on your neck! Let alone a thing that, at the very moment you rejoice in it, leaves you and abandons you!","If you consider yourself smart and aware, do not pay attention to these things and do not worry about them. Let go of all those things that cannot accompany you on the eternal journey, those that perish and vanish under the pressure of worldly changes, the events of Barzakh, and the explosions of the Day of Judgment.","Do you not see that you have a delicate and sensitive side that is never satisfied with anything other than 'forever' and the 'eternal', and it does not look at or submit to anything else? To the point that if the whole world were given to it, that natural need of yours would still not be satisfied and reassured? This side, which demands 'forever' and is fond of 'eternity', is the power of your feelings and delicate aspects. So, obey the commands and demands of these delicate sides, which themselves are obedient and submissive to the commands of their Wise Creator. Yes, obey those sides and thereby save yourself from all sorrows."]}],ux=[{id:1,type:"video",title:"Lesson on the Message of Ikhlas",duration:"18:42",desc:"Reading the 20th Flash from Risale-i Nur."},{id:2,type:"audio",title:"Listening to the 10th Word (Resurrection)",duration:"42:15",desc:"Audio reading of the 10th Word."},{id:3,type:"poster",title:"Quote from The Flashes",desc:"Daily poster from Nursi's texts."}],dx=[{topic:"The Greatest Name of Allah",refs:[{book:"The Flashes",section:"30th Flash"}]},{topic:"Patience",refs:[{book:"The Letters",section:"23rd Letter, 4th Question"},{book:"The Words",section:"21st Word"}]},{topic:"Ijtihad",refs:[{book:"The Words",section:"27th Word"}]},{topic:"Sincerity (Ikhlas)",refs:[{book:"The Flashes",section:"20th Flash"},{book:"The Flashes",section:"21st Flash"}]},{topic:"Inspiration and Revelation",refs:[{book:"The Letters",section:"19th Letter"}]},{topic:"Europe",refs:[{book:"The Flashes",section:"17th Flash"}]},{topic:"Belief in the Prophets",refs:[{book:"The Words",section:"19th Word"},{book:"The Rays",section:"7th Ray"}]},{topic:"Belief in the Hereafter",refs:[{book:"The Words",section:"10th Word"},{book:"The Rays",section:"9th Ray"}]},{topic:"Belief in Destiny (Qadar)",refs:[{book:"The Words",section:"26th Word"}]},{topic:"Belief in Angels",refs:[{book:"The Words",section:"29th Word"}]},{topic:"Brotherhood",refs:[{book:"The Letters",section:"22nd Letter"}]},{topic:"Earthquake",refs:[{book:"The Words",section:"14th Word Appendix"}]},{topic:"Oneness of Allah",ref ting",refs:[{book:"The Letters",section:"29th Letter"}]},{topic:"Racism",refs:[{book:"The Letters",section:"26th Letter"}]},{topic:"Knowledge",refs:[{book:"The Rays",section:"15th Ray"}]},{topic:"Zakat",refs:[{book:"The Letters",section:"22nd Letter"}]},{topic:"Women",refs:[{book:"The Flashes",section:"24th Flash"}]},{topic:"Life",refs:[{book:"The Flashes",section:"30th Flash"}]},{topic:"Life in the Grave",refs:[{book:"The Words",section:"13th Word"}]},{topic:"Nature",refs:[{book:"The Flashes",section:"23rd Flash"}]},{topic:"Sufyan",refs:[{book:"The Rays",section:"5th Ray"}]},{topic:"Sunnah of the Prophet ﷺ",refs:[{book:"The Flashes",section:"11th Flash"}]},{topic:"Politics",refs:[{book:"The Rays",section:"11th Ray"}]},{topic:"Salawat on the Prophet ﷺ",refs:[{book:"The Flashes",section:"28th Flash"}]},{topic:"Gratitude (Shukr)",refs:[{book:"The Letters",section:"28th Letter"}]},{topic:"Compassion",refs:[{book:"The Letters",section:"8th Letter"}]},{topic:"Satan",refs:[{book:"The Flashes",section:"13th Flash"}]}],fx=[{key:"iman",title:"الإيمان",icon:"✦",desc:"أساس نور القلب والحياة",count:142,accent:"#6f8c44"},{key:"quran",title:"القرآن الكريم",icon:"❖",desc:"منبع كل معرفة",count:168,accent:"#c9a44c"},{key:"newej",title:"الصلاة",icon:"☾",desc:"الصلة اليومية بالخالق",count:96,accent:"#5b7637"},{key:"hiwa",title:"الأمل والرجاء",icon:"✧",desc:"النور في الظلمات",count:88,accent:"#d9bd78"},{key:"sebr",title:"الصبر",icon:"◈",desc:"القوة الداخلية في الشدائد",count:74,accent:"#6b513a"},{key:"dlniyayi",title:"التوكل",icon:"❉",desc:"الثقة بالله تعالى",count:65,accent:"#6f8c44"},{key:"ixlas",title:"الإخلاص",icon:"✺",desc:"صفاء النية لله تعالى",count:58,accent:"#c9a44c"},{key:"merg",title:"الموت والآخرة",icon:"✤",desc:"التفكر في النهاية والبداية الجديدة",count:71,accent:"#5b7637"},{key:"tobe",title:"التوبة",icon:"❀",desc:"العودة إلى نور الله",count:49,accent:"#d9bd78"},{key:"zanyari",title:"العلم",icon:"✦",desc:"نور العقل والمعرفة",count:103,accent:"#6b513a"},{key:"lawan",title:"الشباب",icon:"✧",desc:"رسالة خاصة للجيل الجديد",count:54,accent:"#6f8c44"},{key:"xezan",title:"الزواج",icon:"❖",desc:"أساس المجتمع السليم",count:42,accent:"#c9a44c"},{key:"exlaq",title:"الأخلاق",icon:"◈",desc:"جمال السلوك والآداب",count:87,accent:"#5b7637"},{key:"jiyan",title:"معنى الحياة",icon:"❉",desc:"لماذا جئنا وإلى أين نذهب",count:79,accent:"#d9bd78"}],mx=[{id:1,text:"«يا نفسي المثقلة بالذنوب! لا تقنطي من رحمة الرب الرحيم، فليس هناك ذنب أعظم من رحمته. إن الرجاء في رحمة الله هو عبادة بحد ذاته.»",source:"رسائل النور",volume:"اللمعات",bookId:3,page:"اللمعة السادسة والعشرون، الرجاء الأول",topic:"hiwa",arabic:"لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ"},{id:2,text:"«الإيمان نور، الإيمان قوة؛ نعم، إن الذي يحصل على الإيمان الحقيقي يستطيع أن يتحدى الكون. وبقوة الإيمان يكتسب الإنسان قوة للوقوف أمام أي مصيبة.»",source:"رسائل النور",volume:"الكلمات",bookId:1,page:"الكلمة الثالثة والعشرون، المبحث الأول",topic:"iman",arabic:"اللَّهُ وَلِيُّ الَّذِينَ آمَنُوا"},{id:3,text:"«الصلاة عماد الدين، وهي معراج المؤمن، وهي مفتاح كل خير، ومفتاح خزائن الرب.»",source:"رسائل النور",volume:"الكلمات",bookId:1,page:"الكلمة الرابعة",topic:"newej",arabic:"إِنَّ الصَّلَاةَ تَنْهَىٰ عَنِ الْفَحْشَاءِ"},{id:4,text:"«الصبر مفتاح الفرج والنجاح. من يصبر، تسهل عليه حتى أعظم الأمور. إن الله مع الصابرين؛ فاصبر وستنتصر.»",source:"رسائل النور",volume:"الكلمات",bookId:1,page:"الكلمة الحادية والعشرون",topic:"sebr",arabic:"إِنَّ اللَّهَ مَعَ الصَّابِرِينَ"},{id:5,text:"«القرآن الكريم هو المترجم الأزلي لكتاب الكون الكبير؛ وهو المؤلف الروحي الذي يكشف عن أسرار الآيات التكوينية المختلفة.»",source:"رسائل النور",volume:"الكلمات",bookId:1,page:"الكلمة الخامسة والعشرون",topic:"quran",arabic:"ذَٰلِكَ الْكِتَابُ لَا رَيْبَ فِيهِ"},{id:6,text:"«الموت ليس عدماً، ولا فناءً؛ بل هو نهاية وظيفة وانتقال إلى عالم النور. بالموت يتحرر المؤمن من سجن الجسد.»",source:"رسائل النور",volume:"الكلمات",bookId:1,page:"الكلمة الثامنة والعشرون",topic:"merg",arabic:"كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ"},{id:7,text:"«أيها الشباب! إن مرحلة الشباب واسعة؛ ولكن لأنها تمضي، فإن لذاتها تزول بسرعة جداً، مخلفة وراءها ذنوباً ثقيلة وألماً دائماً.»",source:"رسائل النور",volume:"اللمعات",bookId:3,page:"اللمعة السادسة والعشرون، الرجاء الثامن",topic:"lawan",arabic:"وَبَشِّرِ الَّذِينَ آمَنُوا"},{id:8,text:"«الأخلاق الحسنة هي ثمرة الإيمان؛ الإيمان كشجرة ثمرتها السلوك الجميل. كلما تعمق إيمان الإنسان، كلما أصبح سلوكه ألطف وأجمل.»",source:"رسائل النور",volume:"المثنوي النوري",bookId:8,page:"قسم الأخلاق",topic:"exlaq",arabic:"إِنَّمَا بُعِثْتُ لِأُتَمِّمَ مَكَارِمَ الْأَخْلَاقِ"},{id:9,text:"«البسملة بداية كل شيء؛ البسملة علامة النور على كل شيء. تلك الكلمة المباركة التي تحمل تميزاً كبيراً، هي علامة الرقي والعظمة لكل عمل يُبدأ بها.»",source:"رسائل النور",volume:"الكلمات",bookId:1,page:"الكلمة الأولى",topic:"iman",arabic:"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ"},{id:10,text:"«هذا الكون كتاب كبير للرب؛ كل مخلوق فيه كلمة، وكل ذرة فيه حرف يظهر الأسماء الحسنى لله تعالى.»",source:"رسائل النور",volume:"الكلمات",bookId:1,page:"الكلمة الثلاثون",topic:"jiyan",arabic:"سَنُرِيهِمْ آيَاتِنَا فِي الْآفَاقِ"},{id:11,text:"«التوكل يعني الثقة بالله بعد اتخاذ الأسباب الظاهرية؛ لذا فالتوكل ليس رفضاً للعمل والأسباب، بل تفويض النتيجة لقدرة الله تعالى.»",source:"رسائل النور",volume:"الكلمات",bookId:1,page:"الكلمة الثالثة والعشرون",topic:"dlniyayi",arabic:"وَعَلَى اللَّهِ فَتَوَكَّلُوا"},{id:12,text:"«التوبة باب مفتوح دائماً؛ مهما عظم الذنب، فإن رحمة الله أعظم. لم يفت الأوان للعودة إلى الله.»",source:"رسائل النور",volume:"اللمعات",bookId:3,page:"اللمعة الحادية والعشرون",topic:"tobe",arabic:"إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ"},{id:13,text:"«العلم وسيلة لاكتشاف المعنى، وليس مجرد جمع للمعلومات؛ أي علم لا يقرّب الإنسان إلى الله، فهو عبء على القلب وليس نوراً.»",source:"رسائل النور",volume:"الشعاعات",bookId:4,page:"الشعاع الخامس عشر",topic:"zanyari",arabic:"وَقُل رَّبِّ زِدْنِي عِلْمًا"},{id:14,text:"«الإخلاص روح كل عمل صالح؛ بدون الإخلاص تظهر أعظم الأعمال كحثالة، وبالإخلاص يصبح أصغر عمل كنزاً للآخرة.»",source:"رسائل النور",volume:"اللمعات",bookId:3,page:"اللمعة العشرون (رسالة الإخلاص)",topic:"ixlas",arabic:"وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ"},{id:15,text:"«هذا العالم هو مسجد كبير لله تعالى وسطح الأرض مائدة لنعمه؛ فالمؤمن ينظر إليها بعين الشكر لا بعين الغرور.»",source:"رسائل النور",volume:"المكتوبات",bookId:2,page:"المكتوب الثامن والعشرون",topic:"iman",arabic:"لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ"},{id:16,text:"«الأخوة من أجل الآخرة مقدسة؛ تلك الرابطة تجعل القلوب قلباً واحداً وتعمق الروحانيات. الحقد والعداوة لمصالح دنيوية لا يليقان بروح المؤمن.»",source:"رسائل النور",volume:"المكتوبات",bookId:2,page:"المكتوب الثاني والعشرون",topic:"exlaq",arabic:"إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ"}],hx=[{id:1,topic:"iman",readTime:7,source:"السيرة الذاتية — ٧٧٧",title:"العالم في أزمة خانقة",excerpt:"إن المرض الذي تفشى في جسد المجتمع الغربي وهز أركانه المعنوية يشبه الوباء المخيف.",body:["يمر العالم بأزمة خانقة وقلق معنوي عظيم.","إن المرض الذي تفشى في جسد المجتمع الغربي وهز أركانه المعنوية يشبه الوباء المخيف.","ما هي العلاجات التي ينبغي للمجتمع الإسلامي أن يواجه بها هذا المرض المرعب المتفشي؟ أبالوصفات الفاسدة والظالمة لـ 'الغرب'، أم بالأسس الحية لـ 'الإيمان' التي تنتمي إلى مجتمع قلعة الإسلام؟","أرى القادة غارقين في الغفلة؛ ولا يمكن أبداً دعم 'قلاع الإيمان' بأعمدة الكفر المتآكلة. ولهذا السبب فإن كل جهودي ومساعيي مقتصرة على الإيمان، وقد وجهت كل معاناتي وتعبي كلياً من أجل الإيمان.","إنهم لا يفهمون رسائل النور، أو لا يريدون أن يفهموا. يظنون أنني معلم في مدرسة دينية وأنني جاف وجاهل بالشؤون المادية للعالم!","في الواقع، لقد عملت في العلوم البحتة وجميع الفلسفات الحديثة، وحللت أعقد قضاياها، بل وكتبت فيها مؤلفات.","لكنني لا أعترف بألاعيب المنطق، ولا أصغي لخداع الفلسفة. بل أنشودة جوهر حياة المجتمع، والوجود الروحي، والوجدان، والإيمان هي التي على شفتي. لقد ركزت كل انشغالاتي على أساس التوحيد والإيمان الذي أرساه القرآن. كن على يقين أن الركيزة الأساسية للمجتمع الإسلامي هي هذه فقط؛ وإذا اهتزت، يهلك المجتمع."]},{id:2,topic:"iman",readTime:4,source:"اللمعات — ٣١١",title:"أيها أهل الحق!",excerpt:"حاولوا القضاء على هذا المرض المخيف (مرض الاختلاف) من خلال العمل بهذا المبدأ القرآني العظيم.",body:["أيها أهل الحق!","يا أهل الحقيقة والشريعة والطريقة!","يا من تبحثون عن الحق من أجل الحق فقط!","حاولوا القضاء على هذا المرض المخيف (مرض الاختلاف) من خلال العمل بهذا المبدأ القرآني العالي والعظيم الذي يقول: (وَإِذَا مَرُّوا بِاللَّغْوِ مَرُّوا كِرَامًا)...","تغاضوا عن أخطاء إخوانكم، وسامحوا تقصيرهم، وغضوا الطرف عن عيوب بعضكم البعض، وضعوا نقاشاتكم الداخلية جانباً في الوقت الحالي. لأن الأعداء الخارجيين يهاجمونكم من كل جانب...","وكذلك اعتبروا إنقاذ أهل الحق من الهزيمة والذل أهم واجب عليكم ومسؤوليتكم في الآخرة...","طبقوا في أنفسكم تلك المئات من الآيات والأحاديث التي تدعوكم إلى الأخوة والمحبة والتعاون."]},{id:3,topic:"jiyan",readTime:5,source:"المكتوبات",title:"أيها الغافل!",excerpt:"هل تشك في أنك محفوظ من تدخل من سلمك رمانة على غصن خُلق من أجلك؟",body:["أيها الغافل!","هل تشك في أنك محفوظ ومصان من تدخل من سلمك رمانة على غصن خُلق من أجلك، ويعطيك بطيخة على نبتة نضجت لك؟","إنه من غفلتك أن تظن أن خالق البطيخ غافل عن آكله... ومن عماك أن تفترض أن صانع الرمان قوة عمياء لا تدرك عملها الذي تقوم به بتلك الرمانة وعصارتها لآكلي الفاكهة، ولأولئك المندهشين من هذه الصنعة الذين يقولون: 'سبحان الله الذي خلقني في هذه الصورة والنقش الجميل'!","وأيضاً لأولئك الذين يتفكرون في نعومة ورقة الرمانة ويقولون: ﴿فَتَبَارَكَ اللَّهُ أَحْسَنُ الْخَالِقِينَ﴾ (المؤمنون: ١٤). ولأولئك الذين يتأملون في هذا النظام المرتب الذي يصدح بكل قوته: ﴿أَلَا يَعْلَمُ مَنْ خَلَقَ وَهُوَ اللَّطِيفُ الْخَبِيرُ﴾ (الملك: ١٤)؟","أم تظن - أيها الجاهل - أن من يرسل كل هذه الثمار لإزالة حاجاتنا لا يرانا ولا يعرفنا؟","أم أن من يسخر الثدييات الأليفة وغيرها من الحيوانات لمصلحتنا، ويضعها تحت تصرفنا وفي مساكننا لا يرانا؟"]},{id:4,topic:"iman",readTime:6,source:"الكلمات",title:"اعلم! أنك ترتكب أمراً قبيحاً جداً",excerpt:"اعلم! أنك ترتكب أمراً قبيحاً جداً إن ربطت قلبك بشيء لن يبقى معك بعد فناء هذا العالم.",body:["اعلم! أنك ترتكب أمراً قبيحاً جداً إن ربطت قلبك بشيء لن يبقى معك بعد فناء هذا العالم، بل يفارقك حتى بخراب الدنيا. لأن الإنسان لا يتصرف بحكمة إن قيد قلبه بشيء فانٍ!","ناهيك عن ذلك الشيء الذي، بانتهاء العصر الذي تعيش فيه، يتركك ويدير ظهره لك! ناهيك عن الشيء الذي لا يرافقك في رحلة البرزخ! ناهيك عن الشيء الذي يصحبك فقط إلى باب قبرك! بل ناهيك عن شيء يتركك كلياً ودائماً بعد سنة أو سنتين، تاركاً إثمه على عنقك! ناهيك عن شيء يتركك ويتخلى عنك في اللحظة التي تفرح بها به!","إذا كنت تعتبر نفسك ذكياً واعياً، فلا تلقِ بالاً لهذه الأشياء ولا تحزن عليها. تخلَّ عن كل تلك الأشياء التي لا تستطيع أن تكون رفيقك في الرحلة الأبدية، تلك التي تهلك وتفنى تحت ضغط تغيرات الدنيا وأحداث البرزخ وانفجارات القيامة.","ألا ترى أن لك جانباً دقيقاً ورقيقاً لا يرضى أبداً بغير 'الخلود' و 'الشيء الأبدي'، ولا ينظر إلى غيره ولا يخضع له؟ لدرجة أنه لو أُعطي الدنيا بأكملها، فإن تلك الحاجة الفطرية لن تشبع أو تطمئن؟ هذا الجانب الذي يطلب 'الخلود' ويتعلق بـ 'الأبدي' هو قوة مشاعرك وجوانبك اللطيفة. لذا، أطع أوامر ومطالب تلك الجوانب الرقيقة، التي هي بدورها مطيعة وخاضعة لأوامر خالقها الحكيم. نعم، أطع تلك الجوانب، وبذلك أنقذ نفسك من كل هم وغم."]}],gx=[{id:1,type:"video",title:"درس في رسالة الإخلاص",duration:"١٨:٤٢",desc:"قراءة من اللمعة العشرين في رسائل النور."},{id:2,type:"audio",title:"استماع للكلمة العاشرة (الحشر)",duration:"٤٢:١٥",desc:"قراءة صوتية للكلمة العاشرة."},{id:3,type:"poster",title:"مقولة من اللمعات",desc:"ملصق يومي من نصوص النورسي."}],bx=[{topic:"اسم الله الأعظم",refs:[{book:"اللمعات",section:"اللمعة الثلاثون"}]},{topic:"الصبر",refs:[{book:"المكتوبات",section:"المكتوب الثالث والعشرون"},{book:"الكلمات",section:"الكلمة الحادية والعشرون"}]},{topic:"الاجتهاد",refs:[{book:"الكلمات",section:"الكلمة السابعة والعشرون"}]},{topic:"الإخلاص",refs:[{book:"اللمعات",section:"اللمعة العشرون"},{book:"اللمعات",section:"اللمعة الحادية والعشرون"}]},{topic:"الإلهام والوحي",refs:[{book:"المكتوبات",section:"المكتوب التاسع عشر"}]},{topic:"أوروبا",refs:[{book:"اللمعات",section:"اللمعة السابعة عشر"}]},{topic:"الإيمان بالأنبياء",refs:[{book:"الكلمات",section:"الكلمة التاسعة عشر"},{book:"الشعاعات",section:"الشعاع السابع"}]},{topic:"الإيمان بالآخرة",refs:[{book:"الكلمات",section:"الكلمة العاشرة"},{b ,source:"Risale-i Nur",volume:"Sözler",bookId:1,page:"21. Söz",topic:"sebr",arabic:"إِنَّ اللَّهَ مَعَ الصَّابِرِينَ"},{id:5,text:"«Kur'an, şu büyük kâinat kitabının ezelî bir tercümesidir; tekvini ayetlerin sırlarını ortaya çıkaran manevi bir müelliftir.»",source:"Risale-i Nur",volume:"Sözler",bookId:1,page:"25. Söz",topic:"quran",arabic:"ذَٰلِكَ الْكِتَابُ لَا رَيْبَ فِيهِ"},{id:6,text:"«Ölüm hiçlik değil, yokluk değil; ölüm bir vazifenin sonu ve nurani bir âleme geçiştir. Mümin, ölümle beden hapishanesinden kurtulur.»",source:"Risale-i Nur",volume:"Sözler",bookId:1,page:"28. Söz",topic:"merg",arabic:"كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ"},{id:7,text:"«Ey gençler! Gençlik dönemi geniştir; ancak geçici olduğu için lezzetleri çok çabuk kaybolur, geriye ağır günahlar ve daimi acılar bırakır.»",source:"Risale-i Nur",volume:"Lem'alar",bookId:3,page:"26. Lem'a, 8. Rica (Gençlik Rehberi)",topic:"lawan",arabic:"وَبَشِّرِ الَّذِينَ آمَنُوا"},{id:8,text:"«Güzel ahlak imanın meyvesidir; iman, meyvesi güzel davranışlar olan bir ağaç gibidir. İnsanın imanı ne kadar derin olursa, davranışları da o kadar latif olur.»",source:"Risale-i Nur",volume:"Mesnevi-i Nuriye",bookId:8,page:"Ahlak Bölümü",topic:"exlaq",arabic:"إِنَّمَا بُعِثْتُ لِأُتَمِّمَ مَكَارِمَ الْأَخْلَاقِ"},{id:9,text:"«Bismillah her hayrın başıdır; Bismillah her şeyin üzerindeki nurani bir işarettir. Büyük bir sır barındıran o mübarek kelime, onunla başlanan her vazife için bir yücelik işaretidir.»",source:"Risale-i Nur",volume:"Sözler",bookId:1,page:"1. Söz",topic:"iman",arabic:"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ"},{id:10,text:"«Şu kâinat, Rabbin büyük bir kitabıdır; içindeki her mahluk bir kelime ve her zerre, Yüce Allah'ın güzel isimlerini gösteren bir harftir.»",source:"Risale-i Nur",volume:"Sözler",bookId:1,page:"30. Söz",topic:"jiyan",arabic:"سَنُرِيهِمْ آيَاتِنَا فِي الْآفَاقِ"},{id:11,text:"«Tevekkül, esbab-ı zahiriyeye teşebbüs ettikten sonra Allah'a güvenmektir; tevekkül esbabı reddetmek değil, neticeyi Allah'ın kudretine bırakmaktır.»",source:"Risale-i Nur",volume:"Sözler",bookId:1,page:"23. Söz",topic:"dlniyayi",arabic:"وَعَلَى اللَّهِ فَتَوَكَّلُوا"},{id:12,text:"«Tövbe her zaman açık bir kapıdır; günah ne kadar büyük olursa olsun, Allah'ın rahmeti daha büyüktür. Allah'a dönmek için asla çok geç değildir.»",source:"Risale-i Nur",volume:"Lem'alar",bookId:3,page:"21. Lem'a",topic:"tobe",arabic:"إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ"},{id:13,text:"«İlim, sadece bilgi toplamak değil, manayı keşfetmektir; insanı Allah'a yaklaştırmayan her ilim, nur değil kalp üzerinde bir yüktür.»",source:"Risale-i Nur",volume:"Şualar",bookId:4,page:"15. Şua",topic:"zanyari",arabic:"وَقُل رَّبِّ زِدْنِي عِلْمًا"},{id:14,text:"«İhlas, bütün amellerin ruhudur; ihlas olmadan en büyük ameller bile posa gibidir, ihlas ile en küçük amel ahiret hazinesi olur.»",source:"Risale-i Nur",volume:"Lem'alar",bookId:3,page:"20. Lem'a (İhlas Risalesi)",topic:"ixlas",arabic:"وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ"},{id:15,text:"«Şu kâinat Yüce Allah'ın büyük bir mescidi ve yeryüzü O'nun nimetler sofrasıdır; mümin ona gurur gözüyle değil, şükür gözüyle bakar.»",source:"Risale-i Nur",volume:"Mektubat",bookId:2,page:"28. Mektup",topic:"iman",arabic:"لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ"},{id:16,text:"«Ahiret için olan kardeşlik mukaddestir; bu bağ, kalpleri birleştirir ve maneviyatı derinleştirir. Dünyevi menfaatler için kin ve düşmanlık müminin ruhuna yakışmaz.»",source:"Risale-i Nur",volume:"Mektubat",bookId:2,page:"22. Mektup",topic:"exlaq",arabic:"إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ"}],yx=[{id:1,topic:"iman",readTime:7,source:"Tarihçe-i Hayat — 777",title:"Dünya Boğucu Bir Kriz İçinde",excerpt:"Batı toplumunun bedenine yayılan ve manevi direklerini sarsan hastalık, korkunç bir veba gibidir.",body:["Dünya boğucu bir kriz ve büyük bir manevi endişe içinden geçiyor.","Batı toplumunun bedenine yayılan ve manevi direklerini sarsan hastalık, korkunç bir veba gibidir.","İslam toplumunun bu korkunç salgın hastalıkla yüzleşmesi için çareler nelerdir? Acaba 'Batı'nın' çürük ve haksız reçeteleriyle mi, yoksa İslam kalesinin canlı temeli olan 'İman' esaslarıyla mı?","Liderlerin gaflete daldığını görüyorum; 'iman kaleleri' asla küfrün çürük direkleriyle ayakta tutulamaz. Bu yüzden bütün çaba ve mücadelem sadece iman yolundadır ve bütün acılarımı, yorgunluğumu tamamen iman uğrunda harcadım.","Onlar 'Risale-i Nur' mesajlarını anlamıyorlar ya da anlamak istemiyorlar. Beni bir medrese hocası sanıyorlar; dünyanın maddi işlerinden habersiz olduğumu düşünüyorlar!","Hâlbuki ben müspet ilimlerle ve bütün çağdaş felsefelerle meşgul oldum, en karmaşık meselelerini analiz ettim, hatta bu konularda kitaplar yazdım.","Fakat mantık oyunlarını kabul etmiyor ve felsefenin hilelerine kulak asmıyorum. Toplum hayatının özü, manevi varlık, vicdan ve iman hep dilimdedir. Bütün meşguliyetimi Kur'an'ın tesis ettiği Tevhid ve iman temellerine hasrettim. Emin olunuz ki İslam toplumunun ana direği sadece budur; eğer sarsılırsa, toplum helak olur."]},{id:2,topic:"iman",readTime:4,source:"Lem'alar — 311",title:"Ey Ehl-i Hak!",excerpt:"Şu Kur'ani yüksek düstur ile amel edip bu korkunç hastalığı (ihtilaf hastalığını) ortadan kaldırmaya çalışın.",body:["Ey Ehl-i Hak!","Ey ehl-i hakikat, şeriat ve tarikat!","Ey sadece hak için hakkı arayanlar!","Şu yüksek ve muazzam Kur'ani düstur ile amel ederek bu korkunç ihtilaf hastalığını ortadan kaldırmaya çalışın: (Boş bir söz işittiklerinde ondan vakarla yüz çevirirler)...","Kardeşlerinizin hatalarını görmezden gelin, kusurlarını bağışlayın, birbirinizin ayıplarına göz yumun ve iç tartışmalarınızı şimdilik bir kenara bırakın. Çünkü dış düşmanlar her taraftan size saldırıyor...","Ayrıca ehl-i hakkı mağlubiyetten ve zilletten kurtarmayı, en önemli vazifeniz ve ahiret sorumluluğunuz olarak kabul edin...","Sizi kardeşliğe, sevgiye ve yardımlaşmaya çağıran o yüzlerce ayet ve hadisi kendi içinizde tatbik edin."]},{id:3,topic:"jiyan",readTime:5,source:"Mektubat",title:"Ey Gafil!",excerpt:"Senin için yaratılmış bir daldan sana bir nar uzatanın müdahalesinden mahfuz olduğundan şüphen mi var?",body:["Ey Gafil!","Senin için yaratılmış bir daldan sana bir nar uzatan ve senin için olgunlaştırılmış bir asmadan sana bir kavun verenin müdahalesinden korunduğundan ve mahfuz olduğundan şüphen mi var?","Kavunu Yaratan'ın, onu yiyenden habersiz olduğunu zannetmen senin gafletindendir... Nar Sani'inin, meyve yiyenler ve bu sanata hayret edip: 'Beni bu güzel surette ve nakışta yaratan Allah'ı tesbih ederim!' diyenler için o narla ve içindeki suyuyla yaptığı işin farkında olmayan kör bir kuvvet olduğunu varsayman senin körlüğündendir!","Ayrıca narın incecik zarına bakıp: ﴿Yaratanların en güzeli olan Allah ne yücedir!﴾ (Mü'minun: 14) diyenler için... Ve var gücüyle haykıran bu nizamlı düzene bakıp: ﴿Yaratan bilmez mi? O, en ince işleri görüp bilendir, her şeyden haberdardır﴾ (Mülk: 14) diyenler için de?","Yoksa ey cahil! İhtiyaçlarımızı gidermek için bütün bu meyveleri gönderenin bizi görmediğini ve tanımadığını mı sanıyorsun?","Yahut evcil hayvanları ve diğer mahlukatı bizim menfaatimiz için emrimize veren, onları evlerimizde ve barınaklarımızda hizmetimize sunanın bizi görmediğini mi düşünüyorsun?"]},{id:4,topic:"iman",readTime:6,source:"Sözler",title:"Bil ki! Çok çirkin bir iş yapıyorsun",excerpt:"Bil ki! Bu dünyanın yıkılmasından sonra seninle kalmayacak bir şeye kalbini bağlarsan çok çirkin bir iş yapmış olursun.",body:["Bil ki! Bu dünyanın yıkılmasından sonra seninle kalmayacak, hatta dünyanın harab olmasıyla senden ayrılacak bir şeye kalbini bağlarsan çok çirkin bir iş yapmış olursun. Zira insan, kalbini fani bir şeye bağlarsa akıllıca davranmış olmaz!","Kaldı ki, içinde yaşadığın dönemin bitmesiyle seni bırakacak ve sana sırtını dönecek o şey! Barzah (kabir) yolculuğunda sana eşlik etmeyecek olan o şey! Sadece kabrinin kapısına kadar seninle gelecek olan o şey! Bir veya iki yıl sonra seni tamamen ve ebediyen terk edip, günahını boynunda bırakacak olan o şey! Hatta onunla sevindiğin o anda seni bırakıp terk edecek olan o şey!","Eğer kendini akıllı ve şuurlu görüyorsan, bunlara aldırış etme ve onlara üzülme. Ebedi yolculukta sana yoldaş olamayacak, dünya değişikliklerinin, berzah olaylarının ve kıyamet patlamalarının baskısı altında helak olup yok olacak şeylerin hepsini bırak.","Görmüyor musun ki, 'Beka' ve 'Ebedi olan'dan başka hiçbir şeye asla razı olmayan, ondan başkasına bakmayan ve boyun eğmeyen nazik ve ince bir tarafın var? Öyle ki bütün dünya ona verilse, senin o fıtri ihtiyacın yine tatmin olmaz ve huzur bulmaz? İşte 'beka'yı isteyen ve 'ebediyet'e âşık olan o taraf, duygularının ve ince hissiyatının gücüdür. Öyleyse sen de, Hakîm Yaratıcının emirlerine itaatkâr ve boyun eğmiş olan o ince taraflarının emirlerine ve isteklerine itaat et. Evet, o taraflarına itaat et ve bu sayede kendini bütün hüzünlerden kurtar."]}],vx=[{id:1,type:"video",title:"İhlas Risalesi Dersi",duration:"18:42",desc:"Risale-i Nur'dan 20. Lem'a okuması."},{id:2,type:"audio",title:"10. Söz'ü Dinlemek (Haşir)",duration:"42:15",desc:"10. Söz'ün sesli okuması."},{id:3,type:"poster",title:"Lem'alar'dan Alıntı",desc:"Nursî'nin metinlerinden günlük poster."}],kx=[{topic:"İsm-i A'zam",refs:[{book:"Lem'alar",section:"30. Lem'a"}]},{topic:"Sabır",refs:[{book:"Mektubat",section:"23. Mektup"},{book:"Sözler",section:"21. Söz"}]},{topic:"İçtihat",refs:[{book:"Sözler",section:"27. Söz"}]},{topic:"İhlas",refs:[{book:"Lem'alar",section:"20. Lem'a"},{book:"Lem'alar",section:"21. Lem'a"}]},{topic:"İlham ve Vahiy",refs:[{book:"Mektubat",section:"19. Mektup"}]},{topic:"Avrupa",refs:[{book:"Lem'alar",section:"17. Lem'a"}]},{topic:"Peygamberlere İman",refs:[{book:"Sözler",section:"19. Söz"},{book:"Şualar",section:"7. Şua"}]},{topic:"Ahirete İman",refs:[{book:"Sözler",section:"10. Söz"},{book:"Şualar",section:"9. Şua"}]},{topic:"Kadere İman",refs:[{book:"Sözler",section:"26. Söz"}]},{topic:"Meleklere İman",refs:[{book:"Sözler",section:"29. ,accent:"#6f8c44"},{key:"xezan",title:"هاوسەرگیریى",icon:"❖",desc:"بنكەى كۆمەڵگاى ساغ",count:42,accent:"#c9a44c"},{key:"exlaq",title:"ئەخلاق",icon:"◈",desc:"جوانى ڕەفتار و ڕەوشت",count:87,accent:"#5b7637"},{key:"jiyan",title:"مەعنای ژیان",icon:"❉",desc:"بۆچى هاتووين و بۆ كوێ دەچين",count:79,accent:"#d9bd78"}],jx=[{id:1,text:"«ئەی نەفسی منی پڕ لە گوناه! ئومێد لە ڕەحمەتی پەروەردگاری بەخشندە مەبڕە، چونکە هیچ گوناهێک گەورەتر لە ڕەحمەتی ئەو نییە. ئومێد لە ڕەحمەتی خودا خۆی عیبادەتە.»",source:"ڕیسالەی نوور",volume:"بریسکەکان",bookId:3,page:"بریسکەی بیست و شەشەم، ئومێدی یەکەم",topic:"hiwa",arabic:"لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ"},{id:2,text:"«ئیمان نوورە، ئیمان هێزە؛ ئەو کەسەی ئیمانی ڕاستەقینەی هەبێت، دەتوانێت داوای جیهان بکات. لە ئەنجامی ئیماندا ئەو پەیوەندییە ئەو هێزە دەداتە مرۆڤ کە لە بەرامبەر هەموو ئاسایشێکدا ڕابوەستێت.»",source:"ڕیسالەی نوور",volume:"وتەکان",bookId:1,page:"وتەی بیست و سێهەم، باسی یەکەم",topic:"iman",arabic:"اللَّهُ وَلِيُّ الَّذِينَ آمَنُوا"},{id:3,text:"«نوێژ ستوونی دینە. نوێژ مەعراجی باوەڕدارە. نوێژ کلیلی هەموو چاکەیە و کلیلی گەنجینەی پەروەردگاریشە.»",source:"ڕیسالەی نوور",volume:"وتەکان",bookId:1,page:"وتەی چوارەم",topic:"newej",arabic:"إِنَّ الصَّلَاةَ تَنْهَىٰ عَنِ الْفَحْشَاءِ"},{id:4,text:"«ئارامگرتن کلیلی سەرکەوتنە. ئەوەی ئارامی هەبێت، گەورەترین مەسەلەکانیشی بۆ ئاسان دەبێت. خواى گەورە لەگەڵ ئارامگرانە، پس ئارامگرە و سەرکەوتوو دەبیت.»",source:"ڕیسالەی نوور",volume:"وتەکان",bookId:1,page:"وتەی بیست و یەکەم، بێداركردنەوەى سێهەم",topic:"sebr",arabic:"إِنَّ اللَّهَ مَعَ الصَّابِرِينَ"},{id:5,text:"«قورئانی پیرۆز تەرجومانی ئەزەلیى ئەو کتێبە گەورەیەی گەردوونە؛ ئەو نووسەرە ڕۆحییەیە کە سرە جیاوازەکانی ئایەتە تەکوینییەکان ئاشکرا دەکات.»",source:"ڕیسالەی نوور",volume:"وتەکان",bookId:1,page:"وتەی بیست و پێنجەم",topic:"quran",arabic:"ذَٰلِكَ الْكِتَابُ لَا رَيْبَ فِيهِ"},{id:6,text:"«مردن نەبوون نییە، نەمانیش نییە؛ مردن کۆتایی ئەرکێکە و گواستنەوەیە بۆ جیهانێکی نوور. مرۆڤی باوەڕدار بە مردن لە زیندانی جەستە ئازاد دەبێت.»",source:"ڕیسالەی نوور",volume:"وتەکان",bookId:1,page:"وتەی بیست و هەشتەم",topic:"merg",arabic:"كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ"},{id:7,text:"«ئەی لاوەکان! تەمەنی لاوی بەرفرە؛ چونكە دەرۆا و چێژەكانى زۆر زوو لە دەست دەچن، بەڵام تاوانە سەختەكان و ئازارى دائیمی لە دواى دەهێڵێت.»",source:"ڕیسالەی نوور",volume:"بریسکەکان",bookId:3,page:"بریسکەی بیست و شەشەم، ئومێدی هەشتەم (ڕێبەرى لاوان)",topic:"lawan",arabic:"وَبَشِّرِ الَّذِينَ آمَنُوا"},{id:8,text:"«ئەخلاقى جوان دەرئەنجامى ئیمانە؛ ئیمان وەك دارێكە كە بەرى ئەو ڕەفتارە جوانانەیە. هەركەس ئیمانى قووڵتر بێت، ڕەفتارى لطیفترە.»",source:"ڕیسالەی نوور",volume:"مەسنەوی نووری",bookId:8,page:"بەشی ئەخلاق",topic:"exlaq",arabic:"إِنَّمَا بُعِثْتُ لِأُتَمِّمَ مَكَارِمَ الْأَخْلَاقِ"},{id:9,text:"«بسم اللە سەرەتای هەموو شتێكە؛ بسم اللە نیشانەى ڕووناكییە لە سەر هەموو شت. ئەو وشە پیرۆزە كە جیاوازییەكى زۆرى تێدایە، نیشانەى بەرزى و گەورەییە بۆ هەر ئەركێك كە پێى دەستپێبكرێت.»",source:"ڕیسالەی نوور",volume:"وتەکان",bookId:1,page:"وتەی یەكەم",topic:"iman",arabic:"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ"},{id:10,text:"«ئەم گەردوونە كتێبێكى گەورەى پەروەردگارە؛ هەر دروستكراوێك وشەیەكە و هەر گەردیلەیەك حەرفێكە كە ناوەكانى جوانى خوداى گەورە نیشان دەدات.»",source:"ڕیسالەی نوور",volume:"وتەکان",bookId:1,page:"وتەی سیهەم، مەبەستی دووهەم",topic:"jiyan",arabic:"سَنُرِيهِمْ آيَاتِنَا فِي الْآفَاقِ"},{id:11,text:"«تەوەكول واتە متمانە بە خواى گەورە دواى ئەوەى مرۆڤ ئەسبابى زاهیرى ئەنجامدا؛ پس تەوەكول ڕەفز كردنى كار و هۆكار نییە، بەڵكوو سپاردنى ئەنجامە بە دەسەڵاتى خواى گەورە.»",source:"ڕیسالەی نوور",volume:"وتەکان",bookId:1,page:"وتەی بیست و سێهەم، باسی یەکەم، خاڵى سێهەم",topic:"dlniyayi",arabic:"وَعَلَى اللَّهِ فَتَوَكَّلُوا"},{id:12,text:"«تۆبە دەرگایەكى هەمیشە كراوەیە؛ هەرچەند گوناه گەورە بێت، ڕەحمەتى خوداگەورەترە. گەڕانەوە بۆ خودا هەرگیز درەنگ نییە.»",source:"ڕیسالەی نوور",volume:"بریسکەکان",bookId:3,page:"بریسکەی بیست و یەکەم",topic:"tobe",arabic:"إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ"},{id:13,text:"«زانست هۆكارى دۆزینەوەى مەعنایە نەك تەنها كۆكردنەوەى زانیارى؛ هەر زانستێك مرۆڤ نزیكتر نەكاتەوە لە خودا، بارێكە لەسەر دڵى نەك ڕووناكى.»",source:"ڕیسالەی نوور",volume:"تیشکەکان",bookId:4,page:"تيشكى پازدەهەم، مەقامى دووهەم",topic:"zanyari",arabic:"وَقُل رَّبِّ زِدْنِي عِلْمًا"},{id:14,text:"«ئیخلاص ڕۆحى هەموو كاركێكى چاكەیە؛ بەبێ ئیخلاص گەورەترین كارەكان وەك خڵتى دەركەوت، و بە ئیخلاص بچووكترین كاركێ دەبێتە كانزای ئاخیرەت.»",source:"ڕیسالەی نوور",volume:"بریسکەکان",bookId:3,page:"بریسکەی بیستەم (پەیامى ئیخلاص)",topic:"ixlas",arabic:"وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ"},{id:15,text:"«ئەم جیهانە مزگەوتى گەورەى خوداى گەورەیە و ڕووى زەویش سفرەى نیعمەتەكانى ئەوە؛ پس مرۆڤى باوەڕدار بە چاوى شوكر سەیرى دەكات نەك بە چاوى غرور.»",source:"ڕیسالەی نوور",volume:"مەکتووبات",bookId:2,page:"مەكتووبى بيست و هەشتەم، مەسەلەى پێنجەم",topic:"iman",arabic:"لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ"},{id:16,text:"«برایەتى بۆ بەرژەوەندى ئاخیرەت پیرۆزە؛ ئەو پەیوەندییە دڵانە دەكاتە یەك دڵ و ڕووحانیات قووڵتر دەكاتەوە. كینە و دوژمنایەتى بەرژەوەندى دونیایى نا شایستەى ڕۆحى باوەڕدارە.»",source:"ڕیسالەی نوور",volume:"مەکتووبات",bookId:2,page:"مەكتووبى بيست و دووهەم، باسى یەکەم (برایەتى)",topic:"exlaq",arabic:"إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ"}],Sx=[{id:1,topic:"iman",readTime:7,source:"ژیاننامە — ٧٧٧",title:"جیهان بە قەیرانێکى خنکێنەر",excerpt:"ئەو نەخۆشيیەى کە لە جەستەى کۆمەڵگەى خۆراوادا بڵاوبووەتەوە و لەرزەى بە ستوونە مەعنەويیەکانى خستووە، بە وێنەى پەتایەکى ترسناک وایە.",body:["جیهان بە قەیرانێکى خنکێنەر و نیگەرانيیەکى مەعنەویى مەزندا تێدەپەڕێت. ","ئەو نەخۆشيیەى کە لە جەستەى کۆمەڵگەى خۆراوادا بڵاوبووەتەوە و لەرزەى بە ستوونە مەعنەويیەکانى خستووە، بە وێنەى پەتایەکى ترسناک وایە. ","ئایا ئەو چارەسەرانە چین کە کۆمەڵگەى ئیسلام بەرەنگارى ئەم نەخۆشيیە پەرەسێنە ترسناکەى پێ بکات؟ ئایا بە ڕەچەتە گەنیوە ناڕەوا و بۆگەنەکانى «خۆراوا» یان بە بناغە زیندووەکانى «ئیمان» کە هى کۆمەڵگەى قەڵاى ئیسلامن؟ ","من دەبینم سەرەگەورەکان نوقمى بێ ئاگایى بوون، «قەڵاکانى ئیمان»یش هەرگیز بە ستوونە کرمۆڵەکانى کوفر ڕاگیر ناکرێن. لەبەر ئەوەیە کە هەموو هەوڵ و تەقاڵایەکم تەنیا و تەنیا لەڕێى ئیمان دایە و ڕەنج و ماندووبوونیشم بە چڕى تەنیا لە پێناوى ئیماندا خستووەتە کار. ","ئەوان لە «پەیامەکانى نوور» تێناگەن، یان نایانەوێت لێى تێبگەن. پێیان وایە کە من مامۆستاى قوتابخانەیەکى ئایینیم و لە کاروبارە ماددییەکانى دونیادا وشک و بێ ئاگام! ","لە ڕاستیدا من کارم لە زانستەپەتيیەکان و سەرجەم زانست و فەلسەفەکانى هاوچەرخدا کردووە، ئاڵۆزترین مەسەلەکانیانم شى کردووەتەوە، تەنانەت پەڕتووکیشم تیایدا داناون. ","بەڵام دان بە یارى و گەمەى مەنتیقدا نانێم و گوێ لە فرتوفێڵى فەلسەفەش ڕاناگرم. بەڵکوو سروودى گەوهەرى ژیانى کۆمەڵگە و بوونى مەعنەوى و ویژدان و ئیمانی ئەوم لەسەر زارە. هەموو سەرقاڵيیەکانى خۆمم لە بناغەى تەوحید و ئیماندا قەتیس کردووە کە قورئان دایمەزراندووە. دڵنیابە کە ستوونى سەرەکیى کۆمەڵگەى ئیسلام تەنیا ئەوەیە، خۆ ئەگەر لەرزەى پێ بکەوێت، کۆمەڵگە تیادەچێت. "]},{id:2,topic:"iman",readTime:4,source:"بریسکەکان — ٣١١",title:"دەسا ئەی ئەهلی حەق!",excerpt:"هەوڵ بدەن ئەم نەخۆشییە سامناکە (کە نەخۆشی ئیختیلافە) لەناو بەرن، بەوەی کە بەم داب و ڕەویە قورئانییە بەرز و گەورەیە ڕەفتار بکەن.",body:["دەسا ئەی ئەهلی حەق!","ئەی ئەهلی حەقیقەت و شەریعەت و تەریقەت!","ئەی ئەوانەی تەنها لەبەر حەق عەوداڵی حەقن!","هەوڵ بدەن ئەم نەخۆشییە سامناکە (کە نەخۆشی ئیختیلافە) لەناو بەرن، بەوەی کە بەم داب و ڕەویە قورئانییە بەرز و گەورەیە ڕەفتار بکەن کە دەفەرمووێ: (وَإِذَا مَرُّوا بِاللَّغْوِ مَرُّوا كِرَامًا)..","چاوپۆشی لە هەڵەی برایانتان بکەن و، لە کەمو کوڕیان خۆش ببن و، چاو لە ئاستی نەنگی یەکتردا بنوقێنن و، موناقەشەی ناوخۆیی تان ئێستا بخەنە لاوە. چونکە دوژمنە دەرەکییەکانتان وا خەریکن لە هەموو لایەکەوە هێرش دەکەنە سەرتان..","هەوروەها ڕزگارکردنی ئەهلی حەق لە ژێر کەوتن و زەلیلی، بە گرنگترین ئەرکی سەرشان و لێپرسراوی دواڕۆژتان بزانن..","ئەو سەدان ئایەت و فەرموودانە لە خۆتاندا جێبەجێ بکەن کە داوای برایەتی و خۆشەویستی و یارمەتیتان لێ دەکەن."]},{id:3,topic:"jiyan",readTime:5,source:"م. سەعیدی نوورسی — مەکتوبات",title:"ئەی بێ ئاگا !",excerpt:"ئایا لەو گومانەدایت کە تۆ سەربەست و پارێزراو بیت لە دەست تێوەردانی ئەو کەسەی کە بە دارپەلێک هەنارێکت دەدانە دەست؟",body:["ئەی بێ ئاگا !","ئایا لەو گومانەدایت کە تۆ سەربەست و پارێزراو بیت لە دەست تێوەردانی ئەو کەسەی کە بە دارپەلێک هەنارێکت دەدانە دەست کە بۆ تۆ دروست کراوە و ، بە دەزولەی بڕکێکیش کاڵەکێت دەداتێ کە بۆ تۆ پێگەیەنراوە ؟",'ئەوە لە بێئاگاییتە کە پێت وایە بە دیهێنەری کاڵەک ئاگای لە بخۆرەکەی نەبێت و .. لە نابیناییتە کە گومانت وایە دروستکەری هەنار هێزێکی نابینا بێت ئاگای لەو کارەی خۆی نەبێت کە بەو هەنارەو تەڕی و پاراوییەکەی ئەنجامی دەدات بۆ میوەخۆران و بۆ ئەوانەش کە سەریان لەو سنعەتەی سووڕماوە کە سەبارەت بە خۆی دەڵێت : " پاک و خاوێنی بۆ ئەو خوایەی کە منی لەسەر ئەم شێوەو نەخش و نیگارە جوانە بە دیهێناوە " !',"هەروەها بۆ ئەوانەش کە بیر لە نەرمی و ناسکی هەنارەکه دەکەنەوەو دەڵێن : ﴿فَتَبَارَكَ اللَّهُ أَحْسَنُ الْخَالِقِينَ﴾‌‎ ( المؤمنون : ١٤ ) و. . بۆ ئەوانەش کە لەو ڕێکو پێکییە ڕیزکراوەی ڕادەمێنن کە بە هەموو توانای خۆی دەنگی لێ بەرز دەکاتەوە و دەڵێت : ﴿ أَلَا يَعْلَمُ مَنْ خَلَقَ وَهوُ الْلَطِيفُ الْخَبِيرُ ﴾ ( الملك : ١٤ ) ؟","یان - ئەی نەزان ! - پێت وایە کە ئەو کەسەی ئەم هەموو بەروبوومانە بۆ نەهێشتنی پێداویستییەکانی ئێمە دەنێرێت ، نەمانبینێت و نەمانناسێت ؟","یان ئەو کەسەی کە بۆ سوود و بەرژەوەندی ئێمە ئاژەڵە شیردەرە ماڵییەکان و گیانلەبەرانی تر دەخاتە بەردەستمان و ناو خانە و لانەمان ، ئێمە نەبینێت ؟"]},{id:4,topic:"iman",readTime:6,source:"م. سەعیدی نوورسی — وتەکان",title:"بزانە! کارێکی گەلێ نەشیاو دەکەیت",excerpt:"بزانە ! کارێکی گەلێ نەشیاو دەکەیت گەر دڵت بەشتێکەوە ببەستیت کە دوای لەناو چوونی ئەم دنیایە لەگەڵ تۆدا نامێنێتەوە.",body:["بزانە ! کارێکی گەلێ نەشیاو دەکەیت گەر دڵت بەشتێکەوە ببەستیت کە دوای لەناو چوونی ئەم دنیایە لەگەڵ تۆدا نامێنێتەوە ، تەنانەت بە کاول بوونی دنیا ئەویش لێت جیا ببێتەوە. چوونکە مرۆڤ کارێکی ژیرانە ناکات گەر دڵی پابەندی شتی لەناوچوو بکات!","چ جای ئەوشتەی کە بەتەواو بوونی ئەو سەردەمەی تیایدا دەژیت ، وازت لێدەهێنێت و پشتت تێ دەکات! بەڵکو چ جای ئەو شتەی کە لە گەشتی بەرزەخدا هاوڕێت نابێت! بەڵکو چ جای ئەو شتەی کە هەتا دەرگای گۆڕەکەت لەگەڵتدا دێت! بەڵکو چ جای شتێ کە دوای ساڵێک یان دوو ساڵ ، بەتەواوی و هەمیشەیی بەجێت دەهێڵێت و ، تاوانەکەشی دەخاتە ئەستۆی تۆوە! بەڵکو چ جای شتێ کە هەر لەو دەمەدا دڵت پێی خۆشە ، ئەو بەجێت دەهێڵێت و دەستبەردارت دەبێت!","ئەگەر خۆت بە ژیر و وریا ئەزانی ، گوێ بەمانە مەدەو خەمیان پێ مەخۆ. واز لەهەموو ئەو شتانە بهێنە کە ناتوانن لەگەشتی هەمیشەییدا هاوڕێت بن ، ئەوانەی کە لە ژێر پاڵەپەستۆی ئاڵووگۆڕەکانی دنیاو ڕووداوەکانی بەرزەخ و تەقینەوەکانی قیامەتدا ، تیادەچن و نامێنن.",'ئایا نابینیت لایەنێکی ناسک و نیانت هەیە کە بە : " هەمیشە" و "شتی هەمیشەیی " نەبێت هەرگیز بەشتی تر ڕازی نابێت و جگە لەوە بۆ هیچی تر ناڕوانێت و ملی بۆ کەچ ناکات ؟ بە ڕادەیەک کە ئەگەر هەموو دنیای پێ بدرێت ، هێشتا هەر ئەو پێویستییە سروشتییەت تێر و دڵنیا نبێت ؟ ئەم لایەنەی کە ئاوا داخوازی "هەمیشە " و هۆگری "هەمیشەیی " یە بریتییە لە دەسەڵاتی هەست و لایەنە ناسکەکانت .دەسا تۆش گوێڕایەڵی فەرمان و داخوازیەکانی ئەو لایەنە ناسکانەت بە ، ئەوانەی کە بۆ خۆیان گوێڕایەڵ و ملکەچی فەرمانی بەدیهێنەری دانایانن . بەڵێ ، گوێڕایەڵی ئەو لایەنانەت بکە و ، لەم ڕێ یەوە خۆت لە هەموو پەژارەیەک ڕزگار بکە .']}],Tx=[{id:1,type:"video",title:"وانە لە پەیامى ئیخلاص",duration:"١٨:٤٢",desc:"خوێندنەوەى بریسكەى بیستەم لە ڕیسالەى نوور."},{id:2,type:"audio",title:"گوێگرتن لە وتەى دەهەم (پەیامى حەشر)",duration:"٤٢:١٥",desc:"خوێندنەوەى دەنگى وتەى دەهەم."},{id:3,type:"poster",title:"وتە لە بریسكەكان",desc:"پۆستەرى ڕۆژانە لە دەقەكانى نوورسى."}],zx=[{topic:"ئيسمى ئەعزەمى خواى گەورە",refs:[{book:"بریسکەکان",section:"بريسكەى سيهەم"}]},{topic:"ئارامگرتن",refs:[{book:"مەکتووبات",section:"مەكتووبى بيست و سێهەم، پرسيارى چوارەم"},{book:"وتەکان",section:"وتەى بيست و يەكەم، بێداركردنەوەى سێهەم"}]},{topic:"ئيجتيهاد",refs:[{book:"وتەکان",section:"وتەى بيست و حەوتەم"}]},{topic:"ئيخلاص",refs:[{book:"بریسکەکان",section:"بريسكەى بيستەم"},{book:"بریسکەکان",section:"بريسكەى بيست و يەكەم"}]},{topic:"ئيلهام و وەحى",refs:[{book:"مەکتووبات",section:"مەكتووبى nۆزدەهەم، ئاماژەى ڕەوانى چوارەم، بنچينەى دووهەم"},{book:"تیشکەکان",section:"تيشكى حەوتەم (پەيامى بينينەكانى گەشتيارێك)"}]},{topic:"ئەوروپا",refs:[{book:"بریسکەکان",section:"بريسكەى حەڤدەهەم، يادخەرەوەى پێنجەم"}]},{topic:"باوەڕبوون بە پێغەمبەران",refs:[{book:"وتەکان",section:"وتەى nۆزدەهەم"},{book:"وتەکان",section:"وتەى asLine:"ڕۆحی خزمەت و کلیلی قبوڵبوونی کارەکانمان",ikhlasRead:"خوێندنەوەی پەیامەکە",ikhlasExplain:"بۆچی ئەم پەیامە گرنگە؟",ikhlasHide:"شاردنەوەی ڕوونکردنەوە",ikhlasSummaryTitle:"پوختە",ikhlasSummary:"بە کورتی: پەیامی ئیخلاس تەنها بۆ زانیاری و تێگەیشتن نییە، بەڵکوو «دەرمانی ڕۆحە». وەک چۆن مرۆڤ ناتوانێت بڵێت «من جارێک نانم خواردووە و ئیتر پێویستم پێی نییە»، ڕۆحیش بەردەوام پێویستی بەم دەرمانەیە بۆ ئەوەی زیندوو، پاک، و ڕاستگۆ بمێنێتەوە لەگەڵ پەروەردگاریدا.",ikhlasFinalBtn:"ئێستا پەیامی ئیخلاص بخوێنەوە",ikhlasSections:[{title:"یەکەم: باسێکی کورتی پەیامی ئیخلاص",paragraphs:["ئەم پەیامە نەخشەڕێگایەکی مەعنەوییە کە فێرمان دەکات چۆن کارەکانمان تەنها و تەنها بۆ ڕەزامەندی خوای گەورە بێت.","لە پەیامەکەدا مامۆستا باسی ئەوە دەکات کە ئیخلاس (دڵسۆزی و پاکی نیەت بۆ خوا):"],bullets:["بەهێزترین هێزە.","بەرزترین پەناگەیە.","کورتترین ڕێگایە بەرەو حەقیقەت.","گیراوترین نزای مەعنەوییە."],afterBullets:"هەروەها پەیامەکە کۆمەڵێک «دەستوور» (یاسا) و «ڕێگر» (بەربەست) دیاری دەکات. فێرمان دەکات کە پێویست ناکات بەدوای ناوبانگ، پێشوازی خەڵک، یان پیاهەڵدانیاندا بگەڕێین، چونکە ئەگەر خودا لێمان ڕازی بێت، تەنانەت ئەگەر هەموو دنیاش پشتمان تێبکات، هیچ زیانێکمان پێ ناگات."},{title:"دووەم: بۆچی ئەوەندە گرنگە؟",paragraphs:["گرنگی ئەم پەیامە لەوەدایە کە باس لە «ڕۆح»ـی کردەوەکان دەکات."],numbered:[{head:"بێ ئیخلاس کردەوەکان مردوون",body:"وەک چۆن جەستەیەک بێ ڕۆح تەنها گۆشت و ئێسقانێکی بۆگەنە، گەورەترین کاری خێر، نوێژ، یان خزمەتی ئایینیش ئەگەر «ئیخلاس»ـی تێدا نەبێت و بۆ ڕیاکاری و ناو دەرکردن بێت، لای خودا هیچ بەهایەکی نییە و پووچەڵە."},{head:"نهێنی سەرکەوتنی برایەتییە",body:"لە کاری بەکۆمەڵ و بانگەوازدا، زۆرجار کێبڕکێ، حەسودی، و حەزی خۆدەرخستن دروست دەبێت. ئەم پەیامە چەمکی «فەنابوون لەناو برایاندا» (تفاني في الإخوان) دەهێنێتە ئاراوە."},{head:"پاراستن لە فێڵەکانی نەفس",body:"نەفسی مرۆڤ حەز بە پیاهەڵدان و پۆست و پلە دەکات. ئەم پەیامە ئەو بتە ناوەکییانە دەشکێنێت."}]},{title:"سێیەم: بۆچی مامۆستا جەختی کردووەتەوە کە «بەلای کەمەوە پازدە ڕۆژ جارێک بخوێنرێتەوە»؟",paragraphs:["لە سەرەتای پەیامەکەدا مامۆستا نوورسی بە ڕوونی دەنووسێت: (بە لای کەمەوە پازدە ڕۆژ جارێک ئەم «بریسکەیە» بخوێنرێتەوە). هۆکارە شاراوە و مەعنەوییەکانی ئەم ئامۆژگارییە ئەمانەن:"],numbered:[{head:"مرۆڤ لەبیرکەرە (النسيان)",body:"مرۆڤ زوو ئامانجە سەرەکییەکەی لەبیر دەچێتەوە. لەوانەیە کارێک بە نیەتێکی پاک بۆ خودا دەست پێبکەیت، بەڵام دوای مانگێک، کە بینیت خەڵک ستایشت دەکەن، وردە وردە نیەتەکە دەگۆڕێت بۆ حەزی خۆدەرخستن."},{head:"نەفس و شەیتان هەرگیز نانوون",body:"شەیتان و نەفسی ئەممارە بەردەوام هێرش دەهێننە سەر «ئیخلاس»ـی مرۆڤ. ئەوان ناتوانن باوەڕدارێک لە نوێژ بکەن، بەڵام دەتوانن وای لێبکەن نوێژەکەی بۆ ڕیاکاری بێت!"},{head:"نەخۆشییە شاراوەکانی دڵ (الشرك الخفي)",body:"خۆشەویستی ناوبانگ، حەزی باڵادەستی بەسەر هاوڕێکاندا، و چاوەڕوانیی پاداشتی دنیایی لەسەر کاری ئایینی، نەخۆشی زۆر شاراوەن کە وەک مێروولەی ڕەش لەسەر بەردی ڕەش لە شەوی تاریکدا وان."},{head:"پاراستنی ڕێکخستن و خزمەت",body:"مامۆستا دەیزانی ئەگەر ئیخلاس لە نێوان قوتابییەکانیدا نەمێنێت، شیرازەی خزمەتەکەیان هەڵدەوەشێتەوە و دەکەونە دژایەتی یەکتر."}]}]},ar:{heroBismillah:"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",featuredKicker:"رسائل النور",featuredQuote:"«كن من تكون.. ولكن افتح عينيك وانظر، لترى الحقيقة وتنقذ إيمانك الذي هو مفتاح 'السعادة الأبدية'!»",featuredDesc:"رسائل النور تسعى أولاً لإقناع نفس مؤلفها ثم تتحدث مع الآخرين. لذلك، فإن الدرس الذي أقنع نفس مؤلفه الأمارة بالسوء وأزال وساوسها بالكلية، هو بلا شك درس قوي وصافٍ لدرجة أنه يمكنه وحده أن يكون سداً أمام تيار الضلالة في هذا العصر.",featuredAuthor:"الأستاذ سعيد النورسي",featuredSource:"الملاحق _ ١٣٩",featuredBtn:"اقرأ رسالة اليوم",topicsKicker:"رحلة في المعرفة",latestKicker:"أحدث المقالات",latestTitle:"قراءة عميقة",mediaKicker:"المرئيات والصوتيات",readTime:"دقيقة قراءة",readMoreBtn:"اقرأ المزيد ←",seeAllTopics:"عرض كل الموضوعات ←",msgCount:"رسالة",newsletterTitle:"اشترك في نشرة النور",newsletterText:"رسالة أسبوعية خاصة من رسائل النور تصل مباشرة إلى بريدك الإلكتروني، لتروي قلبك بالإيمان دائمًا.",emailPlaceholder:"أدخل بريدك الإلكتروني هنا...",subscribe:"اشتراك",ikhlasTitle:"رسالة الإخلاص",ikhlasLine:"روح الخدمة ومفتاح قبول أعمالنا",ikhlasRead:"قراءة الرسالة",ikhlasExplain:"لماذا هذه الرسالة مهمة؟",ikhlasHide:"إخفاء الشرح",ikhlasSummaryTitle:"الخلاصة",ikhlasSummary:"باختصار: رسالة الإخلاص ليست مجرد معلومات للفهم، بل هي «دواء للروح». وكما لا يمكن للإنسان أن يقول «لقد أكلت مرة واحدة ولم أعد بحاجة للطعام»، فإن الروح تحتاج باستمرار إلى هذا الدواء لتبقى حية ونقية وصادقة مع ربها.",ikhlasFinalBtn:"اقرأ رسالة الإخلاص الآن",ikhlasSections:[{title:"أولاً: نبذة قصيرة عن رسالة الإخلاص",paragraphs:["هذه الرسالة هي خريطة طريق معنوية تعلمنا كيف نجعل أعمالنا خالصة لمرضاة الله تعالى فقط.","يشرح الأستاذ في الرسالة أن الإخلاص (صدق وصفاء النية لله):"],bullets:["هو أقوى قوة.","وأعلى ملجأ.","وأقصر طريق إلى الحقيقة.","وأكثر دعاء معنوي مقبول."],afterBullets:"كما تحدد الرسالة مجموعة من «القواعد» و «الموانع». تعلمنا أنه لا حاجة للبحث عن الشهرة أو استقبال الناس أو مديحهم، لأنه إذا رضي الله عنا، فحتى لو أدار العالم كله ظهره لنا، فلن يصيبنا أي ضرر."},{title:"ثانياً: لماذا هي بالغة الأهمية؟",paragraphs:["تكمن أهمية هذه الرسالة في أنها تتحدث عن «روح» الأعمال."],numbered:[{head:"بدون الإخلاص، الأعمال ميتة",body:"كما أن الجسد بلا روح هو مجرد لحم وعظم متعفن، فإن أعظم أعمال الخير أو الصلاة أو خدمة الدين، إذا خلت من «الإخلاص» وكانت للرياء والشهرة، فلا قيمة لها عند الله وهي باطلة."},{head:"سر نجاح الأخوة",body:"في العمل الجماعي والدعوة، غالباً ما تنشأ المنافسة والحسد وحب الظهور. هذه الرسالة تطرح مفهوم «التفاني في الإخوان»؛ أي أن يتخلى المرء عن «أناه» ويفخر بنجاح أخيه كأنه نجاحه."},{head:"الحماية من حيل النفس",body:"تحب النفس البشرية المديح والمناصب والدرجات. هذه الرسالة تحطم تلك الأصنام الداخلية."}]},{title:"ثالثاً: لماذا أكد الأستاذ على قراءتها «مرة كل خمسة عشر يوماً على الأقل»؟",paragraphs:["في بداية الرسالة يكتب الأستاذ النورسي بوضوح: (يُقرأ هذا «اللمعة» مرة كل خمسة عشر يوماً على الأقل). والأسباب الخفية والمعنوية لهذه النصيحة هي:"],numbered:[{head:"الإنسان نَسَّاء",body:"سرعان ما ينسى الإنسان هدفه الرئيسي. قد تبدأ عملاً بنية خالصة لله، ولكن بعد شهر، عندما ترى الناس يمدحونك، تتغير النية تدريجياً إلى حب الظهور."},{head:"النفس والشيطان لا ينامان أبداً",body:"يستمر الشيطان والنفس الأمارة في مهاجمة «إخلاص» الإنسان. لا يمكنهم منع المؤمن من الصلاة، لكن يمكنهم جعله يصلي للرياء!"},{head:"الأمراض الخفية للقلب (الشرك الخفي)",body:"حب الشهرة، والرغبة في التفوق على الأصدقاء، وتوقع المكافأة الدنيوية على العمل الديني، هي أمراض خفية جداً كالنملة السوداء على الصخرة السوداء في الليلة الظلماء."},{head:"حماية التنظيم والخدمة",body:"علم الأستاذ أنه إذا فُقد الإخلاص بين طلابه، فسوف ينهار نظام خدمتهم ويقعون في عداوة بعضهم البعض."}]}]},tr:{heroBismillah:"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",featuredKicker:"Risale-i Nur",featuredQuote:"«Kim olursan ol.. Ama gözünü aç ve bak, hakikati gör ve 'ebedi mutluluğun' anahtarı olan imanını kurtar!»",featuredDesc:"Risale-i Nur mesajları önce yazarının nefsini ikna etmeye çalışır, sonra başkalarıyla konuşur. Bu nedenle, yazarının kötülüğü emreden nefsini tam olarak ikna eden ve vesveselerini tamamen ortadan kaldıran ders, şüphesiz tek başına bu çağın dalalet akımına karşı bir set olabilecek kadar güçlü ve saf bir derstir.",featuredAuthor:"Üstad Said Nursî",featuredSource:"Lâhikalar _ 139",featuredBtn:"Bugünün Nur Mesajını Oku",topicsKicker:"Marifet İçinde Bir Yolculuk",latestKicker:"Son Makaleler",latestTitle:"Derin Okuma",mediaKicker:"Görsel ve İşitsel Medya",readTime:"dk okuma",readMoreBtn:"Daha fazla oku ←",seeAllTopics:"Tüm konuları gör ←",msgCount:"mesaj",newsletterTitle:"Nur Bültenine Katıl",newsletterText:"Risale-i Nur'dan özel haftalık bir mesaj doğrudan e-postanıza gelsin, kalbinizi her zaman imanla sulayın.",emailPlaceholder:"E-postanızı buraya yazın...",subscribe:"Abone Ol",ikhlasTitle:"İhlas Risalesi",ikhlasLine:"Hizmetin ruhu ve amellerimizin kabulünün anahtarı",ikhlasRead:"Risaleyi Oku",ikhlasExplain:"Bu risale neden önemli?",ikhlasHide:"Açıklamayı Gizle",ikhlasSummaryTitle:"Özet",ikhlasSummary:"Kısacası: İhlas Risalesi sadece anlamak için bir bilgi değil, bir «ruh ilacıdır». Bir insanın «Ben bir kere yemek yedim, artık ihtiyacım yok» diyemeyeceği gibi, ruhun da Rabbiyle canlı, temiz ve dürüst kalabilmesi için bu ilaca sürekli ihtiyacı vardır.",ikhlasFinalBtn:"İhlas Risalesi'ni Şimdi Oku",ikhlasSections:[{title:"Birincisi: İhlas Risalesi Hakkında Kısa Bir Bilgi",paragraphs:["Bu risale, amellerimizi sadece ve sadece Allah'ın rızası için nasıl yapacağımızı öğreten manevi bir yol haritasıdır.","Üstad bu risalede ihlasın (samimiyet ve niyetin saflığının):"],bullets:["En büyük kuvvet olduğunu,","En yüksek bir sığınak olduğunu,","Hakikate giden en kısa yol olduğunu,","En makbul manevi bir dua olduğunu açıklar."],afterBullets:"Ayrıca risale bir dizi «düstur» (kural) ve «mani» (engel) belirler. Şöhret, insanların teveccühü veya övgüsü peşinde koşmamıza gerek olmadığını, çünkü eğer Allah bizden razı olursa, bütün dünya bize sırt çevirse bile bize hiçbir zarar gelmeyeceğini öğretir."},{title:"İkincisi: Neden bu kadar önemli?",paragraphs:["Bu risalenin önemi, amellerin «ruhundan» bahsetmesinde yatar."],numbered:[{head:"İhlassız ameller ölüdür",body:"Ruhsuz bir bedenin sadece çürüyen et ve kemik olması gibi, en büyük hayır işleri, namaz veya din hizmeti bile «ihlas» barındırmıyorsa ve gösteriş ile şöhret için yapılıyorsa, Allah katında hiçbir değeri yoktur ve batıldır."},{head:"Kardeşliğin başarısının sırrıdır",body:"Kolektif çalışmalarda ve tebliğde genellikle rekabet, haset ve kendini gösterme arzusu ortaya çıkar. Bu risale «kardeşlerde fani olma» (tefâni fi'l-ihvan) kavramını ortaya koyar; yani kişinin kendi «benliğini» bırakıp kardeşinin başarısıyla kendi başarısıymış gibi gurur duymasıdır."},{head:"Nefsin hilelerinden korunma",body:"İnsan nefsi övgüyü, makamı ve rütbeyi sever. Bu risale o içsel putları yıkar."}]},{title:"Üçüncüsü: Üstad neden «en az on beş günde bir defa okunmalıdır» diye vurgulamıştır?",paragraphs:["Risalenin başında Üstad Nursî açıkça şöyle yazar: (Bu «Lem'a» en az on beş günde bir defa okunmalıdır). Bu tavsiyenin gizli ve manevi sebepleri şunlardır:"],numbered:[{head:"İnsan unutkandır (Nisyan)",body:"İnsan ana hedefini çabuk unutur. Bir işe Allah için saf bir niyetle başlayabilirsiniz, ancak bir ay sonra insanların sizi övdüğünü gördüğünüzde, niyet yavaş yavaş kendini gösterme arzusuna dönüşür."},{head:"Nefis ve şeytan asla uyumaz",body:"Şeytan ve nefs-i emmare sürekli olarak insanın «ihlasına» saldırır. Bir mümini namaz kılmaktan alıkoyamazlar ama namazını gösteriş için kıldırabilirler!"},{head:"Kalbin gizli hastalıkları (Şirk-i Hafi)",body:"Şöhret sevgisi, arkadaşlara üstün gelme arzusu ve dini bir işten dünyevi bir karşılık bekleme, karanlık bir gecede siyah bir taşın üzerindeki siyah bir karınca kadar gizli hastalıklardır."},{head:"Düzeni ve hizmeti koruma",body:"Üstad, talebeleri arasında ihlas kaybolursa, hizmet düzenlerinin çökeceğini ve birbirlerine düşman olacaklarını biliyordu."}]}]},en:{heroBismillah:"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",featuredKicker:"Risale-i Nur",featuredQuote:"«Whoever you are.. open your eyes and look, see the truth and save your faith, which is the key to 'eternal happiness'!»",featuredDesc:"The messages of Risale-i Nur first try to convince the soul of their author, then they speak with others. Therefore, the lesson that completely convinced the evil-commanding soul of its author and entirely removed its whispers is undoubtedly a strong and pure lesson that can stand alone as a barrier against the current of misguidance of this era.",featuredAuthor:"Ustad Said Nursi",featuredSource:"The Letters (Supplements) _ 139",featuredBtn:"Read Today's Nur Message",topicsKicker:"A Journey Through Knowledge",latestKicker:"Latest Articles",latestTitle:"Deep Reading",mediaKicker:"Visual & Audio Media",readTime:"min read",readMoreBtn:"Read more ←",seeAllTopics:"See all topics ←",msgCount:"messages",newsletterTitle:"Join the Nur Newsletter",newsletterText:"Get a special weekly message from the Risale-i Nur delivered directly to your email, to always water your heart with faith.",emailPlaceholder:"Enter your email here...",subscribe:"Subscribe",ikhlasTitle:"The Message of Ikhlas",ikhlasLine:"The soul of service and the key to the acceptance of our deeds",ikhlasRead:"Read the Message",ikhlasExplain:"Why is this message important?",ikhlasHide:"Hide Explanation",ikhlasSummaryTitle:"Summary",ikhlasSummary:"In short: The Message of Ikhlas is not just information to understand, but a «medicine for the soul». Just as a person cannot say «I ate once and I no longer need food», the soul constantly needs this medicine to remain alive, pure, and truthful with its Lord.",ikhlasFinalBtn:"Read the Message of Ikhlas Now",ikhlasSections:[{title:"First: A Brief Overview of the Message of Ikhlas",paragraphs:["This message is a spiritual roadmap that teaches us how to make our actions purely and solely for the pleasure of Allah.","In the message, the Ustad explains that sincerity (Ikhlas - purity of intention for Allah):"],bullets:["Is the strongest power.","Is the highest refuge.","Is the shortest path to the truth.","Is the most acceptable spiritual prayer."],afterBullets:"The message also sets a series of «rules» and «barriers». It teaches us that there is no need to seek fame, people's welcome, or their praise, because if Allah is pleased with us, even if the whole world turns its back on us, no harm will come to us."},{title:"Second: Why is it so crucial?",paragraphs:["The importance of this message lies in the fact that it speaks of the «soul» of actions."],numbered:[{head:"Without sincerity, actions are dead",body:"Just as a body without a soul is mere rotting flesh and bones, the greatest acts of charity, prayer, or religious service, if devoid of «sincerity» and done for show and fame, have no value with Allah and are void."},{head:"The secret of the success of brotherhood",body:"In collective work and preaching, competition, jealousy, and the desire to show off often arise. This message introduces the concept of «annihilation in the brothers» (Tafani fi al-Ikhwan); meaning that one leaves his «ego» and takes pride in his brother's success as if it were his own."},{head:"Protection from the tricks of the ego",body:"The human ego loves praise, positions, and ranks. This message shatters those inner idols."}]},{title:"Third: Why did the Ustad emphasize reading it «at least once every fifteen days»?",paragraphs:["At the beginning of the message, Ustad Nursi clearly writes: (This «Flash» should be read at least once every fifteen days). The hidden and spiritual reasons for this advice are:"],numbered:[{head:"Man is forgetful (Nisyan)",body:"Man quickly forgets his main goal. You might start a work with a pure intention for Allah, but after a month, when you see people praising you, the intention gradually changes into a desire to show off."},{head:"The ego and Satan never sleep",body:"Satan and the evil-commanding ego constantly attack a person's «sincerity». They cannot stop a believer from praying, but they can make him pray for show!"},{head:"The hidden diseases of the heart (Hidden Shirk)",body:"Love of fame, the desire to dominate friends, and expecting a worldly reward for a religious act are very hidden diseases, like a black ant on a black rock in a dark night."},{head:"Protecting the organization and service",body:"The Ustad knew that if sincerity was lost among his students, the structure of their service would collapse and they would fall into enmity with each other."}]}]}},wx={ckb:{homeTitle:"?????? ????",homeSubtitle:"??????????? ??????? ? ?????? ?? ?????????? ?. ?????? ?????? ?????????? ??? ?????? ?? ???? ?????? ?????? ?????? ? ?????? ???????.",primary:"?????? ????? ????????",secondary:"????????? ?????",dailyTitle:"?????? ?????? ????",dailyVerse:"????? ??????? ???? ?????????????",dailyQuote:"????????? ????? ?????????. ????? ?????? ?????? ????????? ???????????? ?? ????? ?????.",dailySource:"?. ?????? ?????? � ??????",readBook:"?????????? ?? ??????",copy:"????????? ???",copied:"???????",saved:"???????????",ikhlasTitle:"?????? ??????",ikhlasBody:"?????? ???? sale-i Nur), and the teacher of the Nur community.","In his time, at the age of 15, the religious scholars of the time gave him the title 'Bediuzzaman' (meaning 'the wonder of the age').","He is the greatest Kurdish figure of this era and the most prominent scholar to emerge from the Kurdish nation since Mawlana Khalid-i Naqshbandi, achieving global fame."],ny=[{key:"old",title:"Old Said",period:"Birth – 1920",desc:"The first phase of Nursi's life, lasting until the age of 45. In this phase, he served faith and Islam through politics.",highlights:["Early education in Nurs village with his older brother (Abdullah)","Received the title 'Bediuzzaman' at age 15","Memorized around 90 foundational books in religious sciences","Attempted to establish the 'Zehra' university in Kurdistan","Participated in World War I against the Russians","Captured and escaped from Kostroma camp in Siberia"]},{key:"new",title:"New Said",period:"1920 – 1948",desc:"A profound shift in Nursi's thought and path. Here he began writing the 'Epistles of Light'. The book 'Futuh al-Ghayb' by Sheikh Abdul Qadir Gilani had a major impact on him.",highlights:["Exiled to Barla, Burdur, Isparta, Kastamonu, and Emirdag","Wrote the books 'Words' and 'Letters' completely","Wrote a large part of 'Flashes'","Imprisoned in Eskisehir, Denizli, and Afyon","Declared 'New Said cares for both the mind and the heart'"]},{key:"third",title:"Third Said",period:"1948 – 1960",desc:"The final phase of Nursi's life, after his release from Afyon prison. During this time, the Epistles of Light spread globally.",highlights:["Wrote 'A Guide for Youth' in 1952","Spread of the Epistles of Light in Turkey, Pakistan, America, Italy","Passed away on March 23, 1960 in Urfa","Buried in 'Halil-ur Rahman' cemetery","On July 12, 1960, his grave was moved to an unknown location"]}],oy=[{year:"1878",title:"Birth",desc:"In Nurs village, Hizan district, Bitlis."},{year:"1887",title:"Started Education",desc:"At age 9, he went to 'Tag' village and began studying at Mullah Muhammad Emin Efendi's school."},{year:"1893",title:"Title of Bediuzzaman",desc:"At age 15, due to his extraordinary intelligence, Mullah Fethullah Efendi named him 'Bediuzzaman'."},{year:"1897",title:"Life-Changing Event",desc:"Read British Minister Gladstone's statement about the Quran and swore that 'the Quran is a spiritual sun whose light will never fade'."},{year:"1907",title:"Trip to Istanbul",desc:"To present his proposal for establishing 'Zehra' university to the Ottoman government."},{year:"1915",title:"World War I",desc:"Participated in the Caucasus campaign against the Russians as a high-ranking commander."},{year:"1916",title:"Capture",desc:"Wounded while defending Bitlis and captured by the Russians."},{year:"1917",title:"Escape",desc:"Escaped from Kostroma camp and returned to Istanbul via Warsaw, Germany, and Vienna."},{year:"1919",title:"Started Mesnevi-i Nuriye",desc:"Became a member of 'Dar-ul Hikmet-il Islamiye' in Istanbul and began writing Mesnevi-i Nuriye."},{year:"1925",title:"Exile to Burdur",desc:"Wrote the 'First Door of Light'."},{year:"1926",title:"Exile to Barla",desc:"Began writing the Epistles of Light — Words, Letters, and most of Flashes."},{year:"1935",title:"Eskisehir Prison",desc:"Imprisoned for 11 months due to writing the 'Treatise on Islamic Dress (Tesettur)'."},{year:"1943",title:"Denizli Prison",desc:"He and 120 students were imprisoned for 9 months, but acquitted."},{year:"1947",title:"Afyon Prison",desc:"He and 54 students were imprisoned for 20 months."},{year:"1952",title:"Youth Guide",desc:"Wrote 'A Guide for Youth' and was summoned to Istanbul — acquitted."},{year:"1960",title:"Passing",desc:"Passed away on March 23 in Urfa, 2 days after Nawroz, on the Night of Decree (Laylat al-Qadr)."}],sy=[{icon:"✦",title:"Extraordinary Intelligence",desc:"Memorized nearly 90 major texts in grammar, morphology, tafsir, hadith, and Islamic jurisprudence."},{icon:"✶",title:"Modern Sciences",desc:"Gained expertise in chemistry, physics, biology, geology, mathematics, astronomy, and geography."},{icon:"❖",title:"Pioneering Role",desc:"The first to attempt establishing a university in Kurdistan and opening Kurdish schools."},{icon:"◈",title:"Prolific Writer",desc:"Wrote over 130 books and treatises under the title 'Epistles of Light (Risale-i Nur)'."},{icon:"❉",title:"Asceticism",desc:"Even in times of utmost need, he never accepted gifts, charity, or zakat from people."},{icon:"✺",title:"Defending Kurds",desc:"During Sheikh Said Piran's revolt, he said: 'No believer's hand should be stained with the blood of the Kurdish people'."}],ry=[{text:"Death is our Nawroz (New Year) day.",note:"From the book Munazarat, 1911 — He passed away 2 days after Nawroz"},{text:"The Old Said followed the mind more, but the New Said cares for both the mind and the heart.",note:"Regarding the change in his path"},{text:"I must prove and demonstrate to the whole world that the Quran is an unfading, inextinguishable spiritual sun!",note:"His response to British Minister Gladstone's statement, 1897"}],cy=[{value:"+130",label:"Books & Treatises"},{value:"+50",label:"Languages Translated"},{value:"+15",label:"Global Conferences"},{value:"+44",label:"Countries Participated"}],uy={name:"سعيد النورسي",alias:"سعيد الكردي · بديع الزمان",born:"5 يناير 1878",died:"23 مارس 1960",birthplace:"قرية نورس، قضاء هيزان، ولاية بدليس",deathplace:"مدينة أورفا",father:"ميرزا",mother:"نورية"},dy=["سعيد النورسي أو سعيد الكردي المعروف بـ 'بديع الزمان' (ولد في 5 يناير 1878 - توفي في 23 مارس 1960) هو عالم وفيلسوف إسلامي كردي، ومؤلف كليات رسائل النور وأستاذ جماعة النور.","في عصره وفي سن الخامسة عشرة، أطلق عليه علماء الدين في ذلك الوقت لقب 'بديع الزمان' (أي معجزة العصر).","يعد أعظم شخصية كردية في هذا العصر وأبرز عالم ظهر في الأمة الكردية بعد مولانا خالد النقشبندي، وقد نال شهرة عالمية."],fy=[{key:"old",title:"سعيد القديم",period:"الولادة – 1920",desc:"المرحلة الأولى من حياة النورسي، والتي استمرت حتى سن الخامسة والأربعين. في هذه المرحلة، خدم الإيمان والإسلام من خلال السياسة.",highlights:["التعليم المبكر في قرية نورس على يد شقيقه الأكبر (عبد الله)","نال لقب 'بديع الزمان' في سن 15","حفظ حوالي 90 كتاباً أساسياً في العلوم الدينية","حاول تأسيس جامعة 'الزهراء' في كردستان","شارك في الحرب العالمية الأولى ضد الروس","وقع في الأسر وهرب من معسكر كوستروما في سيبيريا"]},{key:"new",title:"سعيد الجديد",period:"1920 – 1948",desc:"تحول عميق في فكر النورسي ومساره. هنا بدأ بكتابة 'رسائل النور'. كان لكتاب 'فتوح الغيب' للشيخ عبد القادر الجيلاني تأثير كبير عليه.",highlights:["نُفي إلى بارلا، بوردور، إسبرطة، قسطموني، وأميرداغ","كتب كتابي 'الكلمات' و'المكتوبات' بالكامل","كتب جزءاً كبيراً من 'اللمعات'","سُجن في إسكي شهير، دنيزلي، وأفيون","أعلن أن 'سعيد الجديد يهتم بالعقل والقلب معاً'"]},{key:"third",title:"سعيد الثالث",period:"1948 – 1960",desc:"المرحلة الأخيرة من حياة النورسي، بعد خروجه من سجن أفيون. في هذه الفترة، انتشرت رسائل النور عالمياً.",highlights:["ألف 'مرشد الشباب' عام 1952","انتشار رسائل النور في تركيا، باكستان، أمريكا، وإيطاليا","توفي في 23 مارس 1960 في مدينة أورفا","دُفن في مقبرة 'خليل الرحمن'","في 12 يوليو 1960، نُقل قبره إلى مكان مجهول"]}],my=[{year:"1878",title:"الولادة",desc:"في قرية نورس، قضاء هيزان، ولاية بدليس."},{year:"1887",title:"بدء التعليم",desc:"في سن التاسعة، ذهب إلى قرية 'تاغ' وبدأ الدراسة في مدرسة الملا محمد أمين أفندي."},{year:"1893",title:"لقب بديع الزمان",desc:"في سن 15، وبسبب ذكائه الخارق، أطلق عليه الملا فتح الله أفندي لقب 'بديع الزمان'."},{year:"1897",title:"حدث غيّر حياته",desc:"قرأ تصريح الوزير البريطاني غلادستون حول القرآن وأقسم أن 'القرآن شمس معنوية لا يخبو نورها أبداً'."},{year:"1907",title:"الرحلة إلى إسطنبول",desc:"لتقديم اقتراحه بتأسيس جامعة 'الزهراء' إلى الحكومة العثمانية."},{year:"1915",title:"الحرب العالمية الأولى",desc:"شارك في حملة القوقاز ضد الروس كقائد رفيع المستوى."},{year:"1916",title:"الأسر",desc:"أصيب أثناء الدفاع عن بدليس ووقع أسيراً في يد الروس."},{year:"1917",title:"الهروب",desc:"هرب من معسكر كوستروما وعاد إلى إسطنبول عبر وارسو، ألمانيا، وفيينا."},{year:"1919",title:"بداية المثنوي النوري",desc:"أصبح عضواً في 'دار الحكمة الإسلامية' في إسطنبول وبدأ بكتابة المثنوي النوري."},{year:"1925",title:"النفي إلى بوردور",desc:"ألف 'الباب الأول للنور'."},{year:"1926",title:"النفي إلى بارلا",desc:"بدأ بكتابة رسائل النور — الكلمات، المكتوبات، ومعظم اللمعات."},{year:"1935",title:"سجن إسكي شهير",desc:"سُجن لمدة 11 شهراً بسبب كتابة 'رسالة الحجاب'."},{year:"1943",title:"سجن دنيزلي",desc:"سُجن هو و120 طالباً لمدة 9 أشهر، ثم تمت تبرئتهم."},{year:"1947",title:"سجن أفيون",desc:"سُجن هو و54 طالباً لمدة 20 شهراً."},{year:"1952",title:"مرشد الشباب",desc:"ألف 'مرشد الشباب' واستُدعي إلى إسطنبول — تمت تبرئته."},{year:"1960",title:"الوفاة",desc:"توفي في 23 مارس في أورفا، بعد يومين من النوروز، في ليلة القدر."}],hy=[{icon:"✦",title:"ذكاء خارق",desc:"حفظ حوالي 90 كتاباً رئيسياً في النحو، الصرف، التفسير، الحديث، والفقه الإسلامي."},{icon:"✶",title:"العلوم الحديثة",desc:"اكتسب خبرة في الكيمياء، الفيزياء، الأحياء، الجيولوجيا، الرياضيات، الفلك، والجغرافيا."},{icon:"❖",title:"دور ريادي",desc:"أول من حاول تأسيس جامعة في كردستان وفتح مدارس كردية."},{icon:"◈",title:"كاتب غزير الإنتاج",desc:"ألف أكثر من 130 كتاباً ورسالة تحت عنوان 'كليات رسائل النور'."},{icon:"❉",title:"الزهد",desc:"حتى في أوقات الحاجة الماسة، لم يقبل الهدايا أو الصدقات أو الزكاة من الناس أبداً."},{icon:"✺",title:"الدفاع عن الكرد",desc:"أثناء ثورة الشيخ سعيد بيران، قال: 'يجب ألا تتلطخ يد أي مؤمن بدماء الشعب الكردي'."}],gy=[{text:"الموت هو يوم النوروز (عيدنا) بالنسبة لنا.",note:"من كتاب المناظرات، 1911 — توفي بعد يومين من النوروز"},{text:"سعيد القديم كان يتبع العقل أكثر، أما سعيد الجديد فيهتم بالعقل والقلب معاً.",note:"حول التغير في مساره"},{text:"لأبرهنن ولأثبتن للعالم أجمع أن القرآن شمس معنوية لا يخبو نورها ولا يمكن إطفاؤها!",note:"رده على تصريح الوزير البريطاني غلادستون، 1897"}],by=[{value:"+130",label:"كتاب ورسالة"},{value:"+50",label:"لغة تُرجمت إليها"},{value:"+15",label:"مؤتمر عالمي"},{value:"+44",label:"دولة مشاركة"}],py={name:"Said Nursi",alias:"Said Kurdi · Bediüzzaman",born:"5 Ocak 1878",died:"23 Mart 1960",birthplace:"Nurs köyü, Hizan ilçesi, Bitlis",deathplace:"Şanlıurfa",father:"Mirza",mother:"Nuriye"},xy=["Said Nursi veya 'Bediüzzaman' olarak bilinen Said Kürdi (doğum 5 Ocak 1878 - ölüm 23 Mart 1960), Kürt İslam âlimi ve filozofu, Risale-i Nur Külliyatı'nın müellifi ve Nur cemaatinin üstadıdır.","Kendi döneminde, henüz 15 yaşındayken, zamanın din âlimleri tarafından kendisine 'Bediüzzaman' (zamanın harikası) unvanı verilmiştir.","Mevlânâ Hâlid-i Bağdâdî'den sonra Kürt milletinden çıkan ve küresel bir üne kavuşan bu çağın en büyük âlimidir."],yy=[{key:"old",title:"Eski Said",period:"Doğum – 1920",desc:"Nursi'nin 45 yaşına kadar süren hayatının ilk evresidir. Bu evrede iman ve İslam'a siyaset yoluyla hizmet etmiştir.",highlights:["Nurs köyünde ağabeyi (Abdullah) yanında ilk eğitim","15 yaşında 'Bediüzzaman' unvanını alması","Dini ilimlerde 90'a yakın temel eseri ezberlemesi","Kürdistan'da 'Zehra' üniversitesini kurma girişimi","Birinci Dünya Savaşı'nda Ruslara karşı katılım","Sibirya'daki Kostroma kampında esaret ve firar"]},{key:"new",title:"Yeni Said",period:"1920 – 1948",desc:"Nursi'nin düşünce ve yolunda derin bir değişim. Burada 'Risale-i Nur'u yazmaya başladı. Abdülkadir Geylani'nin 'Fütuh'ul Gayb' adlı eserinin üzerinde büyük etkisi oldu.",highlights:["Barla, Burdur, Isparta, Kastamonu ve Emirdağ'a sürgün","'Sözler' ve 'Mektubat' kitaplarının tamamlanması","'Lem'alar'ın büyük bir kısmının yazılması","Eskişehir, Denizli ve Afyon'da hapis","'Yeni Said hem akla hem de kalbe önem verir' ilanı"]},{key:"third",title:"Üçüncü Said",period:"1948 – 1960",desc:"Nursi'nin hayatının, Afyon hapishanesinden çıktıktan sonraki son evresi. Bu dönemde Risale-i Nur küresel çapta yayıldı.",highlights:["1952'de 'Gençlik Rehberi'nin yazılması","Risale-i Nur'un Türkiye, Pakistan, Amerika ve İtalya'da yayılması","23 Mart 1960'ta Şanlıurfa'da vefatı","'Halil-ür Rahman' mezarlığına defnedilmesi","12 Temmuz 1960'ta kabrinin bilinmeyen bir yere nakledilmesi"]
